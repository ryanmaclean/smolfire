# SPDX-License-Identifier: Apache-2.0
# tpm-hosted.yml — TPM T1-T6 acceptance suite on a GitHub-HOSTED runner.
#
# Replaces the self-hosted-runner dependency of tpm-vm-test.yml: hosted x64
# runners have working KVM (see build-image-hosted.yml), swtpm is an apt
# install away, and the image comes from the hosted build's artifact instead
# of a runner-local path.
#
# Triggers:
#   - workflow_run: automatically after each successful "Build smolfire Image
#     (hosted runner)" run (active once this file is on the default branch).
#   - workflow_dispatch: manual, with the build run ID to fetch the artifact
#     from.
#
# amd64 only: QEMU's tpm-tis works there; aarch64's tpm-tis-device never
# yields /dev/tpm0 in the guest (see sys/arm64/conf/SMOLFIRE-VM notes).
#
# Gates (docs: .github/workflows/tpm-vm-test.yml header, Phase 3):
#   T1: swtpm control socket appears within 3s
#   T2: /dev/tpm0 present in guest
#   T3: TPM evidence in guest dmesg/kldstat (informational)
#   T4: PCR sha256:0 readable and non-zero
#   T5: seal/unseal round-trip with PCR 0+7 policy
#   T6: PCR 23 changes after tpm2_pcrextend

name: TPM T1-T6 (hosted runner)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID to fetch the smolfire-amd64 artifact from"
        required: true
  workflow_run:
    workflows: ["Build smolfire Image (hosted runner)"]
    types: [completed]

env:
  SSH_PORT: "2241"

jobs:
  tpm-t1-t6:
    name: TPM T1-T6 on built image
    # On workflow_run, only test artifacts of successful MAIN builds:
    # workflow_run always executes the default-branch copy of this file,
    # so auto-testing branch-built artifacts pairs an old workflow with a
    # new image (or vice versa). Branch artifacts are validated by
    # dispatching this workflow with --ref <branch> -f run_id=<build run>.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Validate run_id input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if ! [[ "${{ inputs.run_id }}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: run_id must be the numeric build run ID (got '${{ inputs.run_id }}')."
            exit 1
          fi

      - name: Preflight — KVM, packages
        run: |
          test -c /dev/kvm || { echo "ERROR: no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils swtpm swtpm-tools sshpass openssh-client \
            tpm2-tools
          # tpm2-tools on the HOST: the A5 verifier's ECC path shells out to
          # the real tpm2_checkquote (bin/attest-verify.nu).

      - name: Install Nushell
        run: |
          # Single source of truth for the Nushell version used by every workflow
          # and expected locally: .github/nu-version (bump it there, nowhere else).
          NU_VERSION="$(tr -d '[:space:]' < .github/nu-version)"
          ARCH=$(uname -m | sed 's/arm64/aarch64/')
          case "$(uname -s)" in
            Linux)  TRIPLE="${ARCH}-unknown-linux-musl" ;;
            Darwin) TRIPLE="${ARCH}-apple-darwin" ;;
          esac
          ARCHIVE="nu-${NU_VERSION}-${TRIPLE}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${ARCHIVE}" \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 "nu-${NU_VERSION}-${TRIPLE}/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Nushell version
        run: nu --version

      - name: Fetch built image artifact
        uses: actions/download-artifact@v4
        with:
          name: smolfire-amd64
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: T1 — swtpm socket
        run: |
          ls -lh
          ART=$(find . -name 'smolfire-amd64.qcow2' -type f | head -1)
          test -n "$ART" || { echo "ERROR: artifact has no smolfire-amd64.qcow2 (build may predate the artifact naming)"; find . -maxdepth 3 -type f; exit 1; }
          [ "$ART" = "./smolfire-amd64.qcow2" ] || mv "$ART" smolfire-amd64.qcow2
          mkdir -p /tmp/tpmstate
          # swtpm's pid option is '--pid file=<path>' (not '--pid-file <path>'
          # — that typo made swtpm print usage and exit 1, which was this
          # workflow's actual T1 failure on every prior hosted run).
          swtpm socket --tpmstate dir=/tmp/tpmstate --tpm2 \
            --ctrl type=unixio,path=/tmp/swtpm.sock \
            --pid file=/tmp/swtpm.pid --daemon
          for i in 1 2 3; do
            [ -S /tmp/swtpm.sock ] && { echo "T1 PASS: swtpm socket up at ${i}s"; exit 0; }
            sleep 1
          done
          echo "T1 FAIL: swtpm socket did not appear within 3s"
          exit 1

      - name: Boot guest with TPM
        run: |
          qemu-system-x86_64 \
            -M q35 -accel kvm -cpu host -m 1G \
            -drive file=smolfire-amd64.qcow2,format=qcow2,if=virtio,snapshot=on \
            -chardev "socket,id=chrtpm,path=/tmp/swtpm.sock" \
            -tpmdev emulator,id=tpm0,chardev=chrtpm \
            -device tpm-tis,tpmdev=tpm0 \
            -nic "user,model=virtio-net-pci,hostfwd=tcp::${SSH_PORT}-:22" \
            -display none -daemonize \
            -serial file:/tmp/serial.log \
            -pidfile /tmp/vm.pid
          echo "Waiting for guest SSH (root/smolfire password auth) ..."
          for i in $(seq 1 60); do
            if sshpass -p smolfire ssh -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 \
                 -o PreferredAuthentications=password \
                 -p "$SSH_PORT" root@127.0.0.1 'echo GUEST_UP'; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: guest SSH never came up. Serial tail:"
          tail -50 /tmp/serial.log
          exit 1

      - name: Install tpm2-tools in guest (D-02 retired — SLIRP has outbound)
        run: |
          # tpm2-tools is no longer baked into the image: hosted runners give
          # the SLIRP guest full outbound NAT, so install at test time.
          # NOTE: snapshot=on makes this install ephemeral — fine because
          # T2-T6 run in the same boot; a future reboot-between-gates would
          # silently lose it and must re-install.
          SSHOPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
                   -o PreferredAuthentications=password -o ServerAliveInterval=15
                   -p "$SSH_PORT" root@127.0.0.1)
          # Transition guard: artifacts from pre-eviction builds still have it.
          if sshpass -p smolfire ssh "${SSHOPTS[@]}" 'command -v tpm2_pcrread && command -v nu' >/dev/null 2>&1; then
            echo "tpm2-tools + nushell already present (pre-eviction artifact) — skipping install"
            exit 0
          fi
          # certctl rehash: FreeBSD-caroot ships certs under /usr/share/certs
          # but /etc/ssl/certs may be unpopulated if the post-install hook
          # never ran in the DESTDIR chroot; idempotent, ~1s.
          # IGNORE_OSVERSION: repo packages may be built on a newer 15.x than
          # the image's FreeBSD_version.
          if ! timeout 420 sshpass -p smolfire ssh "${SSHOPTS[@]}" '
                set -e
                certctl rehash || true
                env ASSUME_ALWAYS_YES=yes IGNORE_OSVERSION=yes /usr/sbin/pkg bootstrap
                env ASSUME_ALWAYS_YES=yes IGNORE_OSVERSION=yes pkg install -y tpm2-tools nushell
                command -v tpm2_pcrread && command -v nu'; then
            echo "INSTALL FAIL: pkg bootstrap/install of tpm2-tools/nushell failed over SLIRP."
            echo "This is a network/repo/trust infra failure, NOT a TPM regression:"
            echo "check DNS (10.0.2.3), pkg.FreeBSD.org reachability, /etc/ssl/certs,"
            echo "and ABI/osversion in the log above."
            exit 1
          fi

      - name: T2-T6 — in-guest TPM checks
        run: |
          SSH() {
            sshpass -p smolfire ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password \
              -p "$SSH_PORT" root@127.0.0.1 "$@"
          }
          fail=0

          # T2: device node
          if SSH 'test -c /dev/tpm0'; then echo "T2 PASS: /dev/tpm0 present"
          else echo "T2 FAIL: /dev/tpm0 missing"; fail=1; fi

          # T3 (informational): kernel evidence
          SSH 'kldstat -v 2>/dev/null | grep -i tpm || dmesg | grep -i tpm' \
            && echo "T3 PASS: TPM kernel evidence" \
            || echo "T3 WARN: no kldstat/dmesg TPM evidence (compiled-in driver may not list)"

          # T4-T6 need tpm2-tools — installed at test time by the
          # "Install tpm2-tools in guest" step (or pre-baked in older artifacts).
          if ! SSH 'command -v tpm2_pcrread' >/dev/null 2>&1; then
            echo "T4-T6 FAIL: tpm2_pcrread unavailable despite the install step passing — inspect its logs"
            exit 1
          fi

          # T4: PCR0 readable, non-zero
          if SSH 'tpm2_pcrread sha256:0' | grep -qE '0x[0-9A-Fa-f]*[1-9A-Fa-f]'; then
            echo "T4 PASS: PCR sha256:0 non-zero"
          else echo "T4 FAIL: PCR sha256:0 unreadable or zero"; fail=1; fi

          # T5: seal/unseal round-trip against PCR 0+7 policy
          # tpm2_flushcontext -t between steps: swtpm has few transient-object
          # slots, and without flushing, Esys_Load dies with 0x902 "out of
          # memory for object contexts" (seen on the first full T5 run).
          # Saved .ctx files reload via TPM2_ContextLoad after a flush.
          if SSH 'set -e
              d=$(mktemp -d)
              cd "$d"
              echo smolfire-seal-test > secret.txt
              tpm2_createprimary -C o -g sha256 -G ecc -c primary.ctx -Q
              tpm2_flushcontext -t
              tpm2_createpolicy --policy-pcr -l sha256:0,7 -L policy.pcr -Q
              tpm2_flushcontext -t
              tpm2_flushcontext -s || true
              tpm2_create -C primary.ctx -g sha256 -u seal.pub -r seal.priv \
                -L policy.pcr -i secret.txt -Q
              tpm2_flushcontext -t
              tpm2_load -C primary.ctx -u seal.pub -r seal.priv -c seal.ctx -Q
              tpm2_unseal -c seal.ctx -p pcr:sha256:0,7 > out.txt
              tpm2_flushcontext -t
              cmp secret.txt out.txt'; then
            echo "T5 PASS: seal/unseal round-trip"
          else echo "T5 FAIL: seal/unseal round-trip"; fail=1; fi

          # T6: PCR 23 changes after extend
          if SSH 'set -e
              a=$(tpm2_pcrread sha256:23)
              tpm2_pcrextend "23:sha256=$(printf smolfire | sha256sum | cut -d" " -f1)"
              b=$(tpm2_pcrread sha256:23)
              [ "$a" != "$b" ]'; then
            echo "T6 PASS: PCR 23 changed after extend"
          else echo "T6 FAIL: PCR 23 did not change"; fail=1; fi

          exit "$fail"

      # ── Phase 4: Remote Attestation (A5) ─────────────────────────────────────
      # Reuses the already-booted VM/SSH session above (SSH_PORT=2241,
      # root/smolfire password auth). Ported from tpm-vm-test.yml.

      - name: A5 — Ensure guest-attest.nu is available in guest
        run: |
          # The hosted-built image does not bake guest-attest.nu in, so the
          # scp fallback below is the live path (the bake-path check first
          # keeps this working if a future image bakes it back in).
          if sshpass -p smolfire ssh -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null -p "$SSH_PORT" \
               root@127.0.0.1 'test -f /usr/local/bin/guest-attest.nu'; then
            echo "guest-attest.nu already present in guest"
            exit 0
          fi
          sshpass -p smolfire scp -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            bin/guest-attest.nu root@127.0.0.1:/usr/local/bin/guest-attest.nu
          sshpass -p smolfire ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -p "$SSH_PORT" \
            root@127.0.0.1 'chmod 0755 /usr/local/bin/guest-attest.nu'

      - name: A5 — Generate fresh nonce
        id: a5-nonce
        run: |
          NONCE=$(openssl rand -hex 32)
          echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"
          echo "Generated nonce: $NONCE"

      - name: A5 — Run guest attestation
        run: |
          NONCE="${{ steps.a5-nonce.outputs.nonce }}"
          TASK_ID="tpm-ci-$(date +%s)"
          echo "Running guest attestation with task_id=$TASK_ID nonce=$NONCE"
          # TEMPORARY-DIAGNOSTIC (revert before merge): TSS2_LOG ESYS trace for
          # createek 0x903 — guest tpm2-tss 4.1.3 emits ESYS detail to
          # stderr, which ssh forwards into this step's captured log.
          sshpass -p smolfire ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -p "$SSH_PORT" \
            root@127.0.0.1 \
            "TSS2_LOG=all+TRACE nu /usr/local/bin/guest-attest.nu --nonce $NONCE --task-id $TASK_ID --output-dir /tmp"

      - name: A5 — Copy artifacts from guest to host
        run: |
          mkdir -p /tmp/a5-artifacts
          for f in quote.msg quote.sig ak.pub attestation.toml expected_pcr.txt; do
            sshpass -p smolfire scp -P "$SSH_PORT" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "root@127.0.0.1:/tmp/$f" "/tmp/a5-artifacts/$f" || {
              echo "WARNING: could not copy /tmp/$f from guest"
            }
          done
          ls -la /tmp/a5-artifacts/

      - name: A5 — Run verifier and assert success
        run: |
          set -e
          NONCE="${{ steps.a5-nonce.outputs.nonce }}"
          EXPECTED_PCR=$(cat /tmp/a5-artifacts/expected_pcr.txt)
          echo "Expected PCR digest: $EXPECTED_PCR"
          nu bin/attest-verify.nu \
            --quote /tmp/a5-artifacts/attestation.toml \
            --expected-pcr-digest "$EXPECTED_PCR" \
            --nonce "$NONCE" \
            --quote-msg /tmp/a5-artifacts/quote.msg \
            --quote-sig /tmp/a5-artifacts/quote.sig \
            --ak-pub /tmp/a5-artifacts/ak.pub \
            | tee /tmp/a5-verifier-output.toml
          grep -q 'verdict = "PASS"' /tmp/a5-verifier-output.toml || {
            echo "ERROR: attestation verifier did not report PASS"
            exit 1
          }
          echo "A5 PASS: remote attestation verified successfully"

      - name: A5 — Report attestation results in job summary
        if: always()
        run: |
          echo "## Phase 4: Remote Attestation (A5)" >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/a5-verifier-output.toml >> "$GITHUB_STEP_SUMMARY" || echo "(no verifier output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown
        if: always()
        run: |
          [ -f /tmp/vm.pid ] && sudo kill "$(cat /tmp/vm.pid)" 2>/dev/null || true
          [ -f /tmp/swtpm.pid ] && sudo kill "$(cat /tmp/swtpm.pid)" 2>/dev/null || true

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpm-t1-t6-logs
          if-no-files-found: warn
          path: /tmp/serial.log
