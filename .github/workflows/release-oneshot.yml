# SPDX-License-Identifier: Apache-2.0
# release-oneshot.yml — publish release 0.5.0 from already-validated CI
# artifacts. TEMPORARY, self-triggering (established pattern: the session
# token cannot workflow_dispatch, and GITHUB_TOKEN can only create tags on
# commits whose workflow files match main — hence tagging the #100 squash
# commit). DELETE this file after the release exists; retirement commit
# cites the run ID.
#
# Assets (validated runs, ledger 2026-09-24 sections):
#   smolfire-amd64   — run 35959282125: LDDCHECK PASS, KVM boot gate 9s,
#                      62.6 MiB raw / 25.0 MiB compressed (round-3 cut in)
#   smolfire-aarch64 — run 35947103487: first-ever aarch64 image, TCG
#                      soft-gate pass 31s, 63.1/24.9 MiB (pre-cut build)

name: Release 0.5.0 (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/release-oneshot.yml']

permissions:
  contents: write
  actions: read

env:
  TAG: "0.5.0"
  TARGET_SHA: 4fc6a1ec382ba8fd049ec020beac3ccc4b4f13a8   # PR #100 squash on main
  AMD64_RUN: "35959282125"
  AARCH64_RUN: "35947103487"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4   # for the notes file

      - name: Fetch validated qcow2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download "$AMD64_RUN"   -R "${{ github.repository }}" -n smolfire-amd64   -D amd64
          gh run download "$AARCH64_RUN" -R "${{ github.repository }}" -n smolfire-aarch64 -D aarch64
          mv amd64/smolfire-amd64.qcow2     "smolfire-amd64-$TAG.qcow2"
          mv aarch64/smolfire-aarch64.qcow2 "smolfire-aarch64-$TAG.qcow2"
          ls -lh smolfire-*.qcow2

      - name: Integrity — qemu-img check + checksums
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends qemu-utils >/dev/null
          qemu-img check "smolfire-amd64-$TAG.qcow2"
          qemu-img check "smolfire-aarch64-$TAG.qcow2"
          sha256sum smolfire-*.qcow2 | tee "SHA256SUMS-$TAG"

      - name: Create release (tags the main squash commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$TAG" \
            -R "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --prerelease \
            --title "smolfire 0.5.0 — first aarch64 image + round-3 diet" \
            --notes-file .github/RELEASE-NOTES-0.5.0.md \
            "smolfire-amd64-$TAG.qcow2" \
            "smolfire-aarch64-$TAG.qcow2" \
            "SHA256SUMS-$TAG"
          gh release view "$TAG" -R "${{ github.repository }}" --json url,assets
