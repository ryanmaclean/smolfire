# SPDX-License-Identifier: Apache-2.0
# release-image.yml — publish smolfire release assets FROM VALIDATED RUNS.
#
# Closes the newcomer gap called out in README Quickstart: workflow artifacts
# expire and need a GitHub login; Releases are permanent, anonymous downloads.
#
# Mode `release` creates a new release from already-green build runs.
# Existing public releases are immutable here: asset replacement is disabled
# because a failed multi-asset upload can remove published files.
#
# Refusal rules (pure logic + tests: bin/release-plan.nu,
# tests/release-plan-test.nu): every supplied source run must be completed,
# successful, first-attempt, from an approved workflow and repository, and
# exactly at the tag target SHA. The target itself must be on main: GITHUB_TOKEN
# cannot create tags
# on commits whose workflow files differ from main (docs/UR-BSD-VERIFY.md,
# "Release publishing: the 403 is a workflows-permission check").
#
# Every uploaded asset gets a build-provenance attestation; verify with
# `gh attestation verify` (docs/RELEASING.md).
#
# Backward compatible: `run_id` (the old single-run input) is still accepted
# as an alias for amd64_run. Deliberately manual: a release is a human
# judgement (gates green? size acceptable?), not an automatic side effect.

name: Release smolfire Image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Create a new release from validated build runs"
        type: choice
        options: [release]
        default: release
      tag:
        description: "Release tag (e.g. v0.6.0)"
        required: true
      amd64_run:
        description: "Build run ID whose smolfire-amd64 artifact to publish"
        required: false
      run_id:
        description: "DEPRECATED alias for amd64_run (kept for older docs)"
        required: false
      aarch64_run:
        description: "Build run ID whose smolfire-aarch64 artifact to publish (optional)"
        required: false
      kernel_run:
        description: "Run ID holding the one-ELF SMOLFIRE kernel artifact (optional)"
        required: false
      kernel_artifact:
        description: "Artifact name inside kernel_run (smolfire-kernel or smolfire-kernel-current)"
        required: false
        default: smolfire-kernel
      target_sha:
        description: "Commit to tag (must be on main). Default: head_sha of the first supplied run"
        required: false
      notes:
        description: "Release notes body text, prepended to the generated asset table"
        required: false
      notes_file:
        description: "Repo-relative path to a notes file (read from the dispatched ref); used if notes is empty"
        required: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write       # create the release + upload assets
  actions: read         # gh run download across runs + resolve run head SHAs
  id-token: write       # OIDC token for build provenance attestation
  attestations: write   # store the attestation
                        # (an explicit permissions map drops all unlisted scopes)

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.mode }} ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MODE: ${{ inputs.mode }}
      TAG: ${{ inputs.tag }}
      AMD64_RUN: ${{ inputs.amd64_run || inputs.run_id }}
      AARCH64_RUN: ${{ inputs.aarch64_run }}
      KERNEL_RUN: ${{ inputs.kernel_run }}
      KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
      TARGET_SHA: ${{ inputs.target_sha }}
      NOTES_BODY: ${{ inputs.notes }}
      NOTES_FILE: ${{ inputs.notes_file }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # The validator (bin/release-plan.nu) is run from this checkout, so a
      # dispatch from any other ref could ship a weakened validator.
      - name: Require dispatch from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "ERROR: dispatch this workflow from main (got $GITHUB_REF)."; exit 1
          fi
          if [ "$MODE" != release ]; then
            echo "ERROR: existing release asset replacement is disabled; use a new versioned tag."
            exit 1
          fi

      - uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Install Nushell
        run: |
          NU_VERSION="$(tr -d '[:space:]' < .github/nu-version)"
          TRIPLE="$(uname -m)-unknown-linux-musl"
          ARCHIVE="nu-${NU_VERSION}-${TRIPLE}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${ARCHIVE}" \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 "nu-${NU_VERSION}-${TRIPLE}/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install qemu-utils
        run: sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Validate inputs and runs
        run: |
          set -euo pipefail
          mkdir -p plan assets
          nu bin/release-plan.nu validate-tag "$TAG"
          nu bin/release-plan.nu validate-notes-file "$NOTES_FILE"
          if [ -n "$NOTES_FILE" ] && [ ! -f "$NOTES_FILE" ]; then
            echo "ERROR: notes_file '$NOTES_FILE' not found in main"; exit 1
          fi
          if [ -z "$AMD64_RUN$AARCH64_RUN$KERNEL_RUN" ]; then
            echo "ERROR: supply at least one of amd64_run / aarch64_run / kernel_run."
            exit 1
          fi
          if [ "$MODE" = replace-asset ]; then
            n=0
            for r in "$AMD64_RUN" "$AARCH64_RUN" "$KERNEL_RUN"; do [ -z "$r" ] || n=$((n+1)); done
            [ "$n" -eq 1 ] || { echo "ERROR: replace-asset swaps exactly one asset class; supply exactly one *_run."; exit 1; }
          fi

          EXISTS=0
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && EXISTS=1
          if [ "$MODE" = release ] && [ "$EXISTS" = 1 ]; then
            echo "ERROR: release $TAG already exists; use a new versioned tag."; exit 1
          fi
          if [ "$MODE" = replace-asset ] && [ "$EXISTS" = 0 ]; then
            echo "ERROR: release $TAG does not exist; use mode=release."; exit 1
          fi

          FIRST_SHA=""
          inspect_run() { # label run
            label="$1"; run="$2"
            [[ "$run" =~ ^[0-9]+$ ]] || { echo "ERROR: $label run '$run' is not numeric"; exit 1; }
            gh api "repos/$REPO/actions/runs/$run" > "plan/$label.run.json"
            SHA=$(jq -er .head_sha "plan/$label.run.json")
            gh api "repos/$REPO/compare/main...$SHA" > "plan/$label.compare.json"
            gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" > "plan/$label.artifacts.json"
            [ -n "$FIRST_SHA" ] || FIRST_SHA="$SHA"
          }
          [ -z "$AMD64_RUN" ]   || inspect_run amd64   "$AMD64_RUN"
          [ -z "$AARCH64_RUN" ] || inspect_run aarch64 "$AARCH64_RUN"
          [ -z "$KERNEL_RUN" ]  || inspect_run kernel  "$KERNEL_RUN"

          TARGET="${TARGET_SHA:-$FIRST_SHA}"
          # A tag may point to a main ancestor, but every published asset must
          # originate at that exact target commit, never a different ancestor.
          printf '{"id":0,"status":"completed","conclusion":"success","head_sha":"%s"}' "$TARGET" > plan/target.run.json
          gh api "repos/$REPO/compare/main...$TARGET" > plan/target.compare.json
          nu bin/release-plan.nu validate-run --label target-sha \
            --run plan/target.run.json --compare plan/target.compare.json

          BUILDER_ID=$(gh api "repos/$REPO/actions/workflows/build-image-hosted.yml" --jq .id)
          KERNEL_ID=$(gh api "repos/$REPO/actions/workflows/smolfire.yml" --jq .id)
          validate_source() { # label workflow_id workflow_path artifact_name
            label="$1"; workflow_id="$2"; workflow_path="$3"; artifact="$4"
            nu bin/release-plan.nu validate-run --label "$label" \
              --run "plan/$label.run.json" --compare "plan/$label.compare.json" \
              --artifacts "plan/$label.artifacts.json" --artifact-name "$artifact" \
              --workflow-id "$workflow_id" --workflow-path "$workflow_path" \
              --repository "$REPO" --target-sha "$TARGET" > "plan/$label.selected.json"
          }
          [ -z "$AMD64_RUN" ] || validate_source amd64 "$BUILDER_ID" .github/workflows/build-image-hosted.yml smolfire-amd64
          if [ -n "$AARCH64_RUN" ]; then
            validate_source aarch64 "$BUILDER_ID" .github/workflows/build-image-hosted.yml smolfire-aarch64
            # A green soft-gate run may still have verdict=inconclusive.
            nu bin/release-plan.nu validate-run --label aarch64-gate \
              --run plan/aarch64.run.json --compare plan/aarch64.compare.json \
              --artifacts plan/aarch64.artifacts.json --artifact-name aarch64-softgate-evidence \
              --workflow-id "$BUILDER_ID" --workflow-path .github/workflows/build-image-hosted.yml \
              --repository "$REPO" --target-sha "$TARGET" > plan/aarch64-gate.selected.json
          fi
          if [ -n "$KERNEL_RUN" ]; then
            [ "$KERNEL_ARTIFACT" = smolfire-kernel ] || { echo "ERROR: kernel artifact must be smolfire-kernel"; exit 1; }
            validate_source kernel "$KERNEL_ID" .github/workflows/smolfire.yml smolfire-kernel
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "All source runs and artifact IDs bound to exact target $TARGET."


      - name: Fetch and check artifacts
        run: |
          set -euo pipefail
          command -v bsdtar >/dev/null || { echo "ERROR: BSD-licensed bsdtar is required for exact-ID artifact extraction"; exit 1; }
          fetch() { # label archive_member_basename
            label="$1"; basename="$2"
            id=$(jq -er .artifact_id "plan/$label.selected.json")
            digest=$(jq -er .artifact_digest "plan/$label.selected.json")
            # Fetch by the validated immutable artifact ID; verify GitHub's
            # SHA-256 of the ZIP before extracting one member to stdout.
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "plan/$label.zip"
            nu bin/release-plan.nu verify-archive --archive "plan/$label.zip" --digest "$digest"
            bsdtar -tf "plan/$label.zip" > "plan/$label.members"
            member=$(nu bin/release-plan.nu select-member --list "plan/$label.members" --basename "$basename")
            mkdir -p "dl/$label"
            bsdtar -xOf "plan/$label.zip" -- "$member" > "dl/$label/$basename"
            test -s "dl/$label/$basename"
          }
          stage_qcow2() {
            arch="$1"
            fetch "$arch" "smolfire-$arch.qcow2"
            out="assets/$(nu bin/release-plan.nu names --tag "$TAG" --arch "$arch")"
            mv "dl/$arch/smolfire-$arch.qcow2" "$out"
            qemu-img check "$out"
            qemu-img info "$out"
          }
          [ -z "$AMD64_RUN" ]   || stage_qcow2 amd64
          if [ -n "$AARCH64_RUN" ]; then
            fetch aarch64-gate gate-verdict.txt
            nu bin/release-plan.nu validate-gate-verdict --file dl/aarch64-gate/gate-verdict.txt
            stage_qcow2 aarch64
          fi
          if [ -n "$KERNEL_RUN" ]; then
            fetch kernel smolfire-kernel
            f=dl/kernel/smolfire-kernel
            [ "$(head -c4 "$f" | od -An -c | tr -d ' ')" = '177ELF' ] || { echo "ERROR: smolfire-kernel is not an ELF"; exit 1; }
            mv "$f" "assets/$(nu bin/release-plan.nu names --tag "$TAG" --kernel)"
          fi
          ls -lh assets

      - name: Checksums and notes
        run: |
          set -euo pipefail
          # Checksums always cover the WHOLE release set. In replace mode the
          # untouched assets are pulled down so SHA256SUMS stays complete.
          mkdir -p all
          if [ "$MODE" = replace-asset ]; then
            # Fail closed: download each untouched asset by exact name, then
            # assert nothing on the release is missing from the checksum set.
            gh api "repos/$REPO/releases/tags/$TAG" --jq '[.assets[] | {name}]' > plan/release-assets.json
            nu bin/release-plan.nu release-fetch --assets plan/release-assets.json --staged-dir assets > plan/fetch.txt
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              gh release download "$TAG" --repo "$REPO" --dir all --pattern "$name"
              [ -f "all/$name" ] || { echo "ERROR: failed to download release asset $name"; exit 1; }
            done < plan/fetch.txt
          fi
          cp -f assets/* all/    # staged (validated) files win over old ones
          rm -f all/*.sha256 all/SHA256SUMS
          if [ "$MODE" = replace-asset ]; then
            nu bin/release-plan.nu release-complete --assets plan/release-assets.json --dir all
          fi
          nu bin/release-plan.nu checksums --dir all | tee plan/SHA256SUMS.txt
          cp -f all/SHA256SUMS assets/SHA256SUMS
          for f in assets/*.qcow2 assets/smolfire-kernel-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            cp -f "all/$(basename "$f").sha256" "assets/"
          done
          ls -l assets
          if [ "$MODE" = release ]; then
            if [ -n "$NOTES_BODY" ]; then printf '%s\n' "$NOTES_BODY" > plan/body.md
            elif [ -n "$NOTES_FILE" ]; then cp -- "$NOTES_FILE" plan/body.md
            else : > plan/body.md; fi
            FLAGS=""; [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
            nu bin/release-plan.nu notes --tag "$TAG" --dir assets --body-file plan/body.md \
              --amd64-run "$AMD64_RUN" --aarch64-run "$AARCH64_RUN" --kernel-run "$KERNEL_RUN" $FLAGS > notes.md
            cat notes.md
          fi

      # Attest BEFORE anything becomes public: a failure here leaves the release
      # untouched and the job simply re-runnable. Attestations cover digests, so
      # the order relative to upload does not change what is attested.
      # SHA pin: actions/attest-build-provenance v4.2.2 (git ls-remote, 2026-10-01).
      # Re-verify tag -> SHA before merging if the pin is bumped.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Create release
        if: ${{ inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          echo "Tagging $TARGET (validated as reachable from main)"
          FLAGS=""; [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$TAG" --repo "$REPO" --target "$TARGET" \
            --title "smolfire $TAG" --notes-file notes.md $FLAGS \
            assets/*
          echo "Release $TAG published."

      - name: Summary
        run: |
          {
            echo "### ${MODE} ${TAG}"
            echo ""
            echo '```'
            cat plan/SHA256SUMS.txt
            echo '```'
            echo "Verify: \`gh attestation verify <asset> --repo ${REPO}\`"
          } >> "$GITHUB_STEP_SUMMARY"
