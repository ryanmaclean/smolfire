# SPDX-License-Identifier: Apache-2.0
# smolfire.yml — build + boot-gate the SMOLFIRE microVM kernel.
#
# Rump-kernel spirit on FreeBSD: one PVH-bootable ELF containing kernel +
# static /rescue userland (embedded MFS root). Gated under Firecracker on
# the hosted runner (/dev/kvm), target: SMOLFIRE_READY on serial in << 1s.
#
# Build strategy: same nested FreeBSD-VM pattern as build-image-hosted.yml,
# but kernel-only (kernel-toolchain + buildkernel, ~30-45 min — no
# buildworld, no pkgbase, no release stage).
#
# Triggers: workflow_dispatch plus push/pull_request on the dedicated
# microVM path so SMOLFIRE regressions are validated independently of the
# full qcow2/package workflows.

name: SMOLFIRE microVM kernel

permissions:
  contents: read

# (Round-2 push trigger retired after run #9 went GREEN: TIME_TO_READY=
# 511ms, NET_GATE token-TCP pass + HOST_PING pass over TAP, microvm SLIRP
# net pass at 569ms, de-debugged kernel, isxen() pv.c patch active.)
# (Post-rename revalidation: run 35834636692 GREEN 2026-09-23 — the
# renamed kernel pipeline builds and passes both VMM gates.)
on:
  pull_request:
    paths:
      - '.github/workflows/smolfire.yml'
      - 'README.md'
      - 'docs/BUILDING.md'
      - 'docs/BOOT-TIME-ROADMAP.md'
      - 'bin/build-smolfire.sh'
      - 'docs/upstream/tsc-kvmclock-freq.patch'
      - 'sys/amd64/conf/SMOLFIRE*'
      - 'tests/microvm-primary-test.nu'
      - 'tests/smolfire-rootfs-test.nu'
  push:
    paths:
      - '.github/workflows/smolfire.yml'
      - 'README.md'
      - 'docs/BUILDING.md'
      - 'docs/BOOT-TIME-ROADMAP.md'
      - 'bin/build-smolfire.sh'
      - 'docs/upstream/tsc-kvmclock-freq.patch'
      - 'sys/amd64/conf/SMOLFIRE*'
      - 'tests/microvm-primary-test.nu'
      - 'tests/smolfire-rootfs-test.nu'
  workflow_dispatch:
    inputs:
      tslog:
        description: "Also build SMOLFIRE-TSLOG and capture 3 TSLOG boots + 3 release wall-clock boots (docs/BOOT-TIME-ROADMAP.md §3)"
        type: boolean
        default: false

env:
  WORK: /mnt/smolfire-ci
  SSH_PORT: "2253"
  SRC_BRANCH: releng/15.0
  BASE_URL: https://download.freebsd.org/releases/VM-IMAGES/15.0-RELEASE/amd64/Latest
  BASE_IMG: FreeBSD-15.0-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2
  MICROVM_SIZE_LIMIT: "41943040"
  MICROVM_READY_TARGET_MS: "1000"
  # PVH boot (the protocol FreeBSD kernels use — XEN_ELFNOTE_PHYS32_ENTRY)
  # was merged in Firecracker v1.12.0 (PR #5048); v1.10.0 entered the ELF
  # via the Linux protocol => instant KVM_EXIT_SHUTDOWN, zero serial (run #1).
  FC_VER: v1.12.0

jobs:
  smolfire:
    name: Build + microVM gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — KVM, packages, firecracker
        run: |
          set -e
          test -c /dev/kvm || { echo "ERROR: no /dev/kvm"; exit 1; }
          sudo chmod 666 /dev/kvm
          sudo mkdir -p "$WORK" && sudo chown "$(id -u)" "$WORK"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils expect xz-utils genisoimage openssh-client
          # Firecracker release binary (runner has direct internet)
          cd "$WORK"
          curl -fsSL -o fc.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz"
          tar xzf fc.tgz
          FC=$(find . -name "firecracker-${FC_VER}-x86_64" -type f | head -1)
          test -n "$FC" || { echo "ERROR: firecracker binary not in tgz"; find . -maxdepth 3; exit 1; }
          install -m 0755 "$FC" "$WORK/firecracker"
          "$WORK/firecracker" --version

      - name: Fetch FreeBSD 15.0 base image
        run: |
          set -e
          cd "$WORK"
          curl -fsSL -o base.qcow2.xz "$BASE_URL/$BASE_IMG.xz"
          unxz base.qcow2.xz
          qemu-img resize base.qcow2 40G

      - name: Create cloud-init NoCloud seed (root SSH key)
        run: |
          set -e
          cd "$WORK"
          ssh-keygen -t ed25519 -N '' -f ci_key -q
          printf 'instance-id: smolfire-ci\nlocal-hostname: smolfire-build\n' > meta-data
          {
            echo '#cloud-config'
            echo 'users:'
            echo '  - name: root'
            echo '    ssh_authorized_keys:'
            echo "      - $(cat ci_key.pub)"
            echo 'runcmd:'
            echo "  - echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config"
            echo '  - service sshd restart || true'
          } > user-data
          genisoimage -output seed.iso -volid cidata -joliet -rock user-data meta-data

      - name: Boot FreeBSD build VM (KVM)
        run: |
          set -e
          cd "$WORK"
          qemu-system-x86_64 \
            -M q35 -accel kvm -cpu host \
            -smp "$(nproc)" -m 8G \
            -drive file=base.qcow2,format=qcow2,if=virtio \
            -cdrom seed.iso \
            -nic "user,model=virtio-net-pci,hostfwd=tcp::${SSH_PORT}-:22" \
            -display none -daemonize \
            -serial "file:${WORK}/serial.log" \
            -pidfile "${WORK}/vm.pid"
          echo "Waiting for SSH ..."
          for i in $(seq 1 120); do
            if ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=3 -o BatchMode=yes -p "$SSH_PORT" \
                   root@127.0.0.1 'echo VM_UP && uname -rm'; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: SSH never came up. Serial tail:"; tail -50 serial.log; exit 1

      - name: Build SMOLFIRE kernel inside VM
        run: |
          set -e
          cd "$WORK"
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          $SSH 'env ASSUME_ALWAYS_YES=yes pkg update -q && env ASSUME_ALWAYS_YES=yes pkg install -y git'
          $SSH "git clone --depth 1 -b $SRC_BRANCH https://git.freebsd.org/src.git /usr/src"
          tar -C "$GITHUB_WORKSPACE" -cf - . | $SSH 'mkdir -p /root/smolfire && tar -C /root/smolfire -xf -'
          # SMOLFIRE-TSLOG does `include SMOLFIRE`, so copy the whole family.
          $SSH 'cp /root/smolfire/sys/amd64/conf/SMOLFIRE* /usr/src/sys/amd64/conf/'
          TSLOG_ENV=0
          [ "${{ inputs.tslog && 'true' || 'false' }}" = true ] && TSLOG_ENV=1
          BUILD_RC=0
          $SSH "env SMOLFIRE_TSLOG=$TSLOG_ENV sh /root/smolfire/bin/build-smolfire.sh" 2>&1 | tee build.log || BUILD_RC=$?
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/var/tmp/smolfire-build.log \
              "$WORK/smolfire-build-vm.log" || true
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: build rc=$BUILD_RC"; tail -100 "$WORK/smolfire-build-vm.log" || true; exit 1
          fi
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/root/smolfire-kernel "$WORK/smolfire-kernel"
          ls -lh "$WORK/smolfire-kernel"
          BYTES=$(wc -c < "$WORK/smolfire-kernel")
          echo "kernel_bytes=$BYTES ($((BYTES / 1048576)) MiB — this file is the whole OS)"
          if [ "$TSLOG_ENV" = 1 ]; then
            scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -P "$SSH_PORT" root@127.0.0.1:/root/smolfire-kernel-tslog "$WORK/smolfire-kernel-tslog"
            ls -lh "$WORK/smolfire-kernel-tslog"
          fi

      - name: Artifact size gate
        id: microvm_size
        continue-on-error: true
        run: |
          set -e
          cd "$WORK"
          BYTES=$(wc -c < "$WORK/smolfire-kernel")
          echo "artifact: $BYTES bytes; limit: $MICROVM_SIZE_LIMIT bytes"
          if [ "$BYTES" -le "$MICROVM_SIZE_LIMIT" ]; then
            echo "MICROVM_SIZE=pass ($((BYTES / 1048576)) MiB <= $((MICROVM_SIZE_LIMIT / 1048576)) MiB)"
          else
            echo "MICROVM_SIZE=fail ($BYTES bytes > $MICROVM_SIZE_LIMIT bytes)"
            exit 1
          fi

      - name: Firecracker boot trace
        continue-on-error: true
        run: |
          set +e
          cd "$WORK"
          # Net gate prep: tap + per-run token server. Host<->guest only —
          # NO NAT, no ip_forward (only needed for guest->internet).
          sudo ip tuntap add tap0 mode tap user "$(id -un)"
          sudo ip addr add 172.16.0.1/30 dev tap0
          sudo ip link set tap0 up
          TOK="net-${RANDOM}${RANDOM}"
          mkdir -p "$WORK/www"; printf '%s' "$TOK" > "$WORK/www/token.txt"
          ( cd "$WORK/www" && exec python3 -m http.server 8080 --bind 0.0.0.0 ) >/dev/null 2>&1 &
          echo "$!" > "$WORK/httpd.pid"
          sleep 1
          curl -fsS "http://172.16.0.1:8080/token.txt" >/dev/null || { echo "ERROR: token server not answering"; exit 1; }
          # boot_args re-enables ACPI: the FIRECRACKER conf bakes
          # hint.acpi.0.disabled=1 (static env), but the PVH cmdline env is
          # consulted FIRST (kern_environment: md_envp before kern_envp), so
          # this wins. With ACPI on, MADT (-50) outranks mptable (-100) and
          # FreeBSD never walks Firecracker's deprecated MP table — whose
          # unknown entry types panic unconditionally (run #3:
          # "mptable_walk_table: Unknown MP Config Entry 68";
          # MPTABLE_LINUX_BUG_COMPAT does not cover entry types).
          # Second override, same mechanism (run #5): the conf also bakes
          # machdep.disable_tsc_calibration=1, expecting CPUID to provide the
          # TSC frequency — nested-KVM runner vCPUs don't, so tsc_freq=0 and
          # the TSC-deadline LAPIC timer panics "TSC not initialized" in
          # lapic_init. Re-enabling calibration costs a few ms against the
          # emulated i8254 and works on any host.
          # boot_args: env overrides (ledger #3/#4) + kenv-fed static net
          # (rc reads smolfire.ip/gw/fetch; Firecracker auto-appends its
          # virtio_mmio.device= entries so vtnet0 attaches).
          printf '{\n "boot-source": { "kernel_image_path": "%s/smolfire-kernel", "boot_args": "hint.acpi.0.disabled=0 machdep.disable_tsc_calibration=0 smolfire.ip=172.16.0.2/30 smolfire.gw=172.16.0.1 smolfire.fetch=http://172.16.0.1:8080/token.txt" },\n "drives": [],\n "network-interfaces": [ { "iface_id": "eth0", "guest_mac": "06:00:AC:10:00:02", "host_dev_name": "tap0" } ],\n "machine-config": { "vcpu_count": 1, "mem_size_mib": 512 }\n}\n' "$WORK" > fc.json
          cat fc.json
          # The typed command is FIRE_$((6*7)) (braced send = no Tcl subst),
          # so terminal echo can never match FIRE_42 — only real sh output can.
          # Gate order: rc emits the net marker BEFORE SMOLFIRE_READY; the
          # token is per-run random, so a pass cannot be faked by echo.
          cleanup_fc() {
            if [ -f "$WORK/firecracker.pid" ]; then
              kill "$(cat "$WORK/firecracker.pid")" 2>/dev/null || true
              rm -f "$WORK/firecracker.pid"
            fi
            return 0
          }
          trap cleanup_fc EXIT
          timeout 60 expect -c '
            set timeout 30
            set t0 [clock milliseconds]
            spawn '"$WORK"'/firecracker --no-api --config-file '"$WORK"'/fc.json
            set fc_pid [exp_pid]
            exec sh -c "echo $fc_pid > '"$WORK"'/firecracker.pid"
            expect {
              "SMOLFIRE_NET_OK '"$TOK"'" { puts "\nNET_GATE=pass (guest-initiated TCP, token verified)" }
              "SMOLFIRE_NET_FAIL"        { puts "\nNET_GATE=fail (fetch failed in guest)"; exit 3 }
              "panic"   { expect -timeout 5 timeout; puts "\nBOOT_TRACE=fail (kernel panic — full text above)"; exit 2 }
              timeout   { puts "\nNET_GATE=fail (no net marker within 30s)"; exit 3 }
              eof       { puts "\nBOOT_TRACE=fail (firecracker exited)"; exit 2 }
            }
            expect {
              "SMOLFIRE_READY" {
                set dt [expr [clock milliseconds]-$t0]
                puts "\nTIME_TO_READY=${dt}ms"
                send {echo FIRE_$((6*7))}
                send "\r"
                expect {
                  "FIRE_42" {
                    puts "\nSHELL_GATE=pass (interactive shell confirmed)"
                    if {[catch {exec ping -c 2 -W 2 172.16.0.2} pout]} {
                      puts "\nHOST_PING=fail ($pout)"; exit 4
                    } else { puts "\nHOST_PING=pass (host->guest ICMP over tap)" }
                    if {![catch {exec ps -o rss= -p $fc_pid} rss]} {
                      puts "\nSMOLFIRE_METRIC ready.host.rss_kib=[string trim $rss]"
                    }
                    puts "\nBOOT_TRACE=pass"; exit 0
                  }
                  timeout   { puts "\nSHELL_GATE=fail (shell unresponsive)"; exit 1 }
                }
              }
              "panic"   { expect -timeout 5 timeout; puts "\nBOOT_TRACE=fail (kernel panic — full text above)"; exit 2 }
              timeout   { puts "\nBOOT_TRACE=fail (no READY within 30s)"; exit 1 }
              eof       { puts "\nBOOT_TRACE=fail (firecracker exited)"; exit 2 }
            }' | tee firecracker-gate.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > firecracker-gate.rc
          echo "firecracker_expect_rc=$RC"
          {
            echo "### SMOLFIRE microVM size report"
            echo '```'
            grep -h -a -E '^SMOLFIRE_METRIC |^SMOLFIRE_SECTION ' \
              "$WORK/smolfire-build-vm.log" "$WORK/firecracker-gate.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Firecracker network gate
        id: firecracker_network
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -e
          cd "$WORK"
          test -f firecracker-gate.log || { echo "missing firecracker-gate.log"; exit 1; }
          grep -F "NET_GATE=pass" firecracker-gate.log >/dev/null
          grep -F "HOST_PING=pass" firecracker-gate.log >/dev/null
          echo "FIRECRACKER_NETWORK=pass"

      - name: Firecracker boot-time gate
        id: firecracker_boot_time
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -e
          cd "$WORK"
          test -f firecracker-gate.log || { echo "missing firecracker-gate.log"; exit 1; }
          DT=$(sed -n 's/.*TIME_TO_READY=\([0-9][0-9]*\)ms.*/\1/p' firecracker-gate.log | head -1)
          test -n "$DT" || { echo "no TIME_TO_READY marker found"; exit 1; }
          echo "TIME_TO_READY=${DT}ms; target <= ${MICROVM_READY_TARGET_MS}ms"
          if [ "$DT" -le "$MICROVM_READY_TARGET_MS" ]; then
            echo "FIRECRACKER_BOOT_TIME=pass"
          else
            echo "FIRECRACKER_BOOT_TIME=fail"
            exit 1
          fi

      - name: Firecracker shell gate
        id: firecracker_shell
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -e
          cd "$WORK"
          test -f firecracker-gate.log || { echo "missing firecracker-gate.log"; exit 1; }
          grep -F "SHELL_GATE=pass" firecracker-gate.log >/dev/null
          echo "FIRECRACKER_SHELL=pass"

      - name: QEMU microvm gate
        id: qemu_microvm
        # Runs even when the Firecracker gates fail — that is exactly when
        # the cross-check is most diagnostic (a VMM-specific vs kernel bug).
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: |
          set -e
          cd "$WORK"
          test -f "$WORK/smolfire-kernel" || { echo "no kernel built — skipping QEMU cross-check"; exit 0; }
          # Secondary consumer check: PVH direct boot on stock QEMU microvm.
          timeout 60 expect -c '
            set timeout 30
            set t0 [clock milliseconds]
            spawn qemu-system-x86_64 -M microvm -accel kvm -cpu host -m 512M \
              -kernel '"$WORK"'/smolfire-kernel \
              -append "hint.acpi.0.disabled=0 machdep.disable_tsc_calibration=0 smolfire.fetch=http://10.0.2.2:8080/token.txt" \
              -netdev user,id=n0 -device virtio-net-device,netdev=n0 \
              -display none -serial mon:stdio
            set qemu_pid [exp_pid]
            exec sh -c "echo $qemu_pid > '"$WORK"'/qemu-microvm.pid"
            expect {
              "SMOLFIRE_NET_OK" { puts "\nMICROVM_NET=pass (SLIRP guest-initiated TCP)" }
              "SMOLFIRE_NET_FAIL" { puts "\nMICROVM_NET=fail"; exit 1 }
              "SMOLFIRE_READY"  { puts "\nMICROVM_TIME_TO_READY=[expr [clock milliseconds]-$t0]ms (net markers skipped)"; exit 0 }
              timeout           { puts "\nMICROVM: no output"; exit 1 }
              eof               { puts "\nMICROVM: qemu exited"; exit 1 }
            }
            expect {
              "SMOLFIRE_READY" { puts "\nMICROVM_TIME_TO_READY=[expr [clock milliseconds]-$t0]ms"; exit 0 }
              timeout          { puts "\nMICROVM: no READY"; exit 1 }
              eof              { puts "\nMICROVM: qemu exited"; exit 1 }
            }' | tee qemu-microvm.log

      - name: TSLOG capture — 3 TSLOG boots + 3 release wall-clock boots (tslog only)
        # Measurement, not a gate: runs after the gates whatever they said
        # (a failing gate is exactly when phase data is most useful).
        # Firecracker only (the VMM §1 of the roadmap describes); same
        # boot_args and TAP net path as the gate so rc does the same work.
        if: ${{ !cancelled() && inputs.tslog }}
        continue-on-error: true
        run: |
          cd "$WORK"
          test -f smolfire-kernel-tslog || { echo "no TSLOG kernel built"; exit 1; }
          sha256sum smolfire-kernel smolfire-kernel-tslog | tee kernels.sha256
          # The gate's firecracker outlives its expect (pty close is not a
          # kill) and still holds tap0 — free it before every boot.
          pkill -f 'firecracker --no-api' || true; sleep 1
          ip link show tap0 >/dev/null 2>&1 || {
            sudo ip tuntap add tap0 mode tap user "$(id -un)"
            sudo ip addr add 172.16.0.1/30 dev tap0
            sudo ip link set tap0 up
          }
          if ! curl -fsS "http://172.16.0.1:8080/token.txt" >/dev/null 2>&1; then
            mkdir -p "$WORK/www"; printf 'tslog' > "$WORK/www/token.txt"
            ( cd "$WORK/www" && exec python3 -m http.server 8080 --bind 0.0.0.0 ) >/dev/null 2>&1 &
            echo "$!" > "$WORK/httpd.pid"; sleep 1
          fi
          mkfc() {  # $1 = kernel file name
            printf '{\n "boot-source": { "kernel_image_path": "%s/%s", "boot_args": "hint.acpi.0.disabled=0 machdep.disable_tsc_calibration=0 smolfire.ip=172.16.0.2/30 smolfire.gw=172.16.0.1 smolfire.fetch=http://172.16.0.1:8080/token.txt" },\n "drives": [],\n "network-interfaces": [ { "iface_id": "eth0", "guest_mac": "06:00:AC:10:00:02", "host_dev_name": "tap0" } ],\n "machine-config": { "vcpu_count": 1, "mem_size_mib": 512 }\n}\n' "$WORK" "$1"
          }
          mkfc smolfire-kernel       > fc-release.json
          mkfc smolfire-kernel-tslog > fc-tslog.json
          # boot KIND N CFG WAITFOR: wall clock exec->READY via expect,
          # full serial to KIND-runN.log (send_user lines land in it too).
          boot() {
            expect -c '
              log_file -noappend '"$WORK/$1-run$2.log"'
              set timeout 30
              set t0 [clock milliseconds]
              spawn '"$WORK"'/firecracker --no-api --config-file '"$WORK/$3"'
              expect {
                "SMOLFIRE_READY" { send_user "\nTIME_TO_READY=[expr [clock milliseconds]-$t0]ms\n" }
                "panic"   { expect -timeout 5 timeout; send_user "\nVERDICT=fail (panic)\n"; exit 2 }
                timeout   { send_user "\nVERDICT=fail (no READY)\n"; exit 1 }
                eof       { send_user "\nVERDICT=fail (firecracker exited)\n"; exit 2 }
              }
              if {"'"$4"'" ne ""} {
                set timeout 300
                expect {
                  "'"$4"'" { send_user "\nTSLOG_CAPTURE=ok\n" }
                  timeout  { send_user "\nTSLOG_CAPTURE=timeout\n"; exit 3 }
                  eof      { send_user "\nTSLOG_CAPTURE=eof\n"; exit 3 }
                }
              }
              exit 0'
            rc=$?
            pkill -f 'firecracker --no-api' || true; sleep 1
            return $rc
          }
          FAILS=0
          for i in 1 2 3; do boot release "$i" fc-release.json ""                 || FAILS=$((FAILS+1)); done
          for i in 1 2 3; do boot tslog   "$i" fc-tslog.json   SMOLFIRE_TSLOG_DONE || FAILS=$((FAILS+1)); done
          {
            echo "### TSLOG capture"
            echo '```'
            cat kernels.sha256
            grep -H -a -E -o 'TIME_TO_READY=[0-9]*ms|TSLOG_CAPTURE=[a-z]*|VERDICT=.*' release-run*.log tslog-run*.log || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          wc -c tslog-run*.log
          [ "$FAILS" -eq 0 ] || { echo "$FAILS boot(s) failed"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smolfire-kernel
          if-no-files-found: warn
          path: |
            /mnt/smolfire-ci/smolfire-kernel
            /mnt/smolfire-ci/smolfire-kernel-tslog
            /mnt/smolfire-ci/kernels.sha256
            /mnt/smolfire-ci/firecracker-gate.log
            /mnt/smolfire-ci/firecracker-gate.rc
            /mnt/smolfire-ci/firecracker.pid
            /mnt/smolfire-ci/qemu-microvm.log
            /mnt/smolfire-ci/qemu-microvm.pid
            /mnt/smolfire-ci/release-run*.log
            /mnt/smolfire-ci/tslog-run*.log
            /mnt/smolfire-ci/build.log
            /mnt/smolfire-ci/smolfire-build-vm.log
            /mnt/smolfire-ci/serial.log

      - name: Record microVM gate results
        if: ${{ always() }}
        run: |
          FAIL=0
          {
            echo 'microvm_size=${{ steps.microvm_size.outcome }}'
            echo 'firecracker_network=${{ steps.firecracker_network.outcome }}'
            echo 'firecracker_boot_time=${{ steps.firecracker_boot_time.outcome }}'
            echo 'firecracker_shell=${{ steps.firecracker_shell.outcome }}'
            echo 'qemu_microvm=${{ steps.qemu_microvm.outcome }}'
          } > "$WORK/gate-results.env"
          while IFS='=' read -r gate outcome; do
            echo "$gate=$outcome"
            [ "$outcome" = "success" ] || FAIL=1
          done < "$WORK/gate-results.env"
          echo "gate_fail=$FAIL" >> "$WORK/gate-results.env"

      - name: Teardown VM
        if: always()
        run: |
          [ -f "$WORK/firecracker.pid" ] && kill "$(cat "$WORK/firecracker.pid")" 2>/dev/null || true
          [ -f "$WORK/qemu-microvm.pid" ] && kill "$(cat "$WORK/qemu-microvm.pid")" 2>/dev/null || true
          [ -f "$WORK/vm.pid" ] && sudo kill "$(cat "$WORK/vm.pid")" 2>/dev/null || true
          [ -f "$WORK/httpd.pid" ] && kill "$(cat "$WORK/httpd.pid")" 2>/dev/null || true
          sudo ip link del tap0 2>/dev/null || true

      - name: Enforce microVM gates
        if: ${{ always() }}
        run: |
          . "$WORK/gate-results.env"
          test "$gate_fail" = 0
