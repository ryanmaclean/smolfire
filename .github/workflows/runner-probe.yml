# SPDX-License-Identifier: Apache-2.0
# runner-probe.yml — empirically determine what the ARM/macOS GitHub
# runner targets provide before building the aarch64 boot gate on them
# (session lesson: verify the consumer side, never assume it).
# TEMPORARY, self-triggering. Report-only: every step succeeds; the
# JOB LOG is the deliverable. Delete after results land in the ledger.

name: Runner capability probe (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/runner-probe.yml']

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Identity
        run: |
          echo "PROBE[${{ matrix.os }}]: uname: $(uname -a)"
          echo "PROBE[${{ matrix.os }}]: arch: $(uname -m)"
          echo "PROBE[${{ matrix.os }}]: cpus: $(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Virtualization capability (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -c /dev/kvm ]; then
            echo "PROBE[${{ matrix.os }}]: KVM=present ($(ls -l /dev/kvm))"
          else
            echo "PROBE[${{ matrix.os }}]: KVM=ABSENT"
          fi
          grep -c -E 'vmx|svm' /proc/cpuinfo 2>/dev/null | sed 's/^/PROBE[${{ matrix.os }}]: x86-virt-flags=/' || true
          ls /dev/kvm* /dev/vhost* 2>/dev/null | sed 's/^/PROBE[${{ matrix.os }}]: dev: /' || true
          apt-cache policy qemu-system-arm 2>/dev/null | head -3 | sed 's/^/PROBE[${{ matrix.os }}]: /'

      - name: Virtualization capability (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PROBE[${{ matrix.os }}]: model: $(sysctl -n hw.model 2>/dev/null || true) / $(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
          echo "PROBE[${{ matrix.os }}]: macos: $(sw_vers -productVersion)"
          for k in kern.hv_support kern.hv_vmm_present kern.hv.supported; do
            v=$(sysctl -n "$k" 2>/dev/null) && echo "PROBE[${{ matrix.os }}]: $k=$v" || echo "PROBE[${{ matrix.os }}]: $k=(absent)"
          done
          command -v brew >/dev/null && echo "PROBE[${{ matrix.os }}]: brew=present" || echo "PROBE[${{ matrix.os }}]: brew=ABSENT"
          command -v qemu-system-aarch64 >/dev/null && echo "PROBE[${{ matrix.os }}]: qemu-aarch64=preinstalled" || echo "PROBE[${{ matrix.os }}]: qemu-aarch64=not-preinstalled"

      - name: HVF smoke (macOS, decisive — brief qemu boot attempt)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          # ~2-4 min brew install; then ask qemu itself whether hvf works.
          brew install --quiet qemu 2>/dev/null || brew install qemu
          echo "PROBE[${{ matrix.os }}]: qemu=$(qemu-system-aarch64 --version | head -1)"
          # Accel probe: launch with -accel hvf and no kernel; success of
          # machine init (reaching monitor 'quit') proves HVF is usable.
          if [ "$(uname -m)" = "arm64" ]; then QBIN=qemu-system-aarch64; MACH=virt; else QBIN=qemu-system-x86_64; MACH=q35; fi
          if echo quit | timeout 60 "$QBIN" -M "$MACH" -accel hvf -m 256M -display none -monitor stdio -S 2>probe.err; then
            echo "PROBE[${{ matrix.os }}]: HVF=WORKS ($QBIN -M $MACH)"
          else
            echo "PROBE[${{ matrix.os }}]: HVF=FAILED:"; sed 's/^/PROBE[${{ matrix.os }}]:   /' probe.err
          fi

      - name: KVM smoke (arm64 Linux, decisive)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends qemu-system-arm
          [ -c /dev/kvm ] && sudo chmod 666 /dev/kvm || true
          if echo quit | timeout 60 qemu-system-aarch64 -M virt -accel kvm -cpu host -m 256M -display none -monitor stdio -S 2>probe.err; then
            echo "PROBE[${{ matrix.os }}]: KVM-accel=WORKS (qemu-system-aarch64 -M virt)"
          else
            echo "PROBE[${{ matrix.os }}]: KVM-accel=FAILED:"; sed 's/^/PROBE[${{ matrix.os }}]:   /' probe.err
          fi
