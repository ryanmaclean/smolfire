#!/bin/sh
# smolfire riscv64 VM release config — QEMU virt machine (EXPERIMENTAL)
#
# SPDX-License-Identifier: BSD-2-Clause
# Copyright (c) 2026 smolfire contributors
#
# *** EXPERIMENTAL — UNTESTED. NO HARDWARE CLAIMS. ***
# riscv64 is FreeBSD Tier 2; QEMU `virt` (rv64gc) is the only target.
# No CI boot gate exists for this conf. See docs/RESEARCH-2026-07.md §3.
#
# Cloned from smolfire-qemu-aarch64.conf (the closer template: UART
# console, no x86 boot_serial); keep the two in sync when editing hooks.
#
# smolfire-qemu-riscv64.conf — FreeBSD 15 riscv64 minimal QEMU VM image
# Used with: make -C /usr/src/release cloudware-release \
#                 TARGET=riscv TARGET_ARCH=riscv64 \
#                 KERNCONF=SMOLFIRE-VM WITH_CLOUDWARE=yes \
#                 CLOUDWARE=smolfire SMOLFIRECONF=<abs path to this file> \
#                 SMOLFIRE_FORMAT=qcow2 SMOLFIRE_FSLIST=ufs VMSIZE=2g
# (FIX-9: SMOLFIRECONF is the real ${TYPE}CONF variable; CLOUDWARE_CONF was
#  never read by the release Makefiles, and plain vm-image never sources a conf.)

# ur-bsd: respect VMSIZE/SWAPSIZE from the caller (make VMSIZE=... -> mk-vmimage -s).
# An unconditional export here silently overrode the pipeline's VMSIZE=2g (FIX-3)
# and produced the 4 GiB-virtual images seen in Phase 1.
export VMSIZE="${VMSIZE:-2g}"
export SWAPSIZE="${SWAPSIZE:-128m}"
export VM_RC_LIST="sshd"

# FIX-10: stock vmimage.subr passes only the FreeBSD-set-* meta names (base/
# kernels/lib32 + -dbg variants; verified on releng/15.0)
# through this hook, and pkg then installs each surviving set's FULL dependency
# closure — grep -v of individual package names can never exclude a set
# dependency (the old filter silently shipped clang, zfs, dtrace, rescue, and
# ~186M of tests via FreeBSD-set-base / FreeBSD-set-tests). The hook's stdout
# is handed verbatim to pkg install, so emit an explicit leaf-package list
# instead; pkg resolves required libraries (openssl-lib, kerberos-lib, zlib,
# ncurses-lib, ufs-lib, ...) as declared dependencies of these leaves.
# Names verified against pkg.freebsd.org FreeBSD:15 base_release_0 catalogs
# for amd64/aarch64. ASSUMPTION (unverified): the riscv64 pkgbase catalog
# carries identical package names — pkgbase set/leaf names are arch-
# independent by construction, but this list has not been checked against
# a riscv64 catalog or build. Verify on the first riscv64 build and record
# the result in docs/UR-BSD-VERIFY.md.
vm_extra_filter_base_packages() {
    cat >/dev/null    # consume and discard the incoming set list
    cat <<'PKGS'
FreeBSD-set-kernels
FreeBSD-bootloader
FreeBSD-clibs
FreeBSD-runtime
FreeBSD-rc
FreeBSD-utilities
FreeBSD-ufs
FreeBSD-geom
FreeBSD-ssh
FreeBSD-dhclient
FreeBSD-resolvconf
FreeBSD-syslogd
FreeBSD-newsyslog
FreeBSD-cron
FreeBSD-devd
FreeBSD-caroot
FreeBSD-certctl
FreeBSD-pkg-bootstrap
FreeBSD-vi
PKGS
}

vm_extra_pre_umount() {
    # Minimal rc.conf: enable sshd, DHCP on vtnet0
    cat >> "${DESTDIR}/etc/rc.conf" <<EOF
hostname="smolfire-riscv64"
ifconfig_vtnet0="DHCP"
sshd_enable="YES"
dumpdev="NO"
EOF

    # ---- FreeBSD 15.1 pkgbase first-boot auto-update guard (issue #39) ----
    # 15.1 pkgbase cloud/VM images auto-update base packages on first boot
    # ("A firstboot package auto updater has been introduced for cloud
    # images" — https://www.freebsd.org/releases/15.1R/relnotes/). The
    # mechanism is the ports rc.d script firstboot_pkg_upgrade (pkg
    # firstboot-pkg-upgrade, sysutils/firstboot-pkg-upgrade), KEYWORD:
    # firstboot — i.e. gated on the firstboot(7) /firstboot sentinel —
    # rcvar firstboot_pkg_upgrade_enable, running `pkg upgrade -r
    # FreeBSD-base -y` and touching /firstboot-reboot to force a reboot.
    # Stock cloud confs enable it via VM_RC_LIST plus
    # firstboot_pkg_upgrade_repos="FreeBSD-base". A first-boot base
    # upgrade breaks image determinism and TPM PCR stability, so pin it
    # OFF now, ahead of the 15.1 rebase (docs/RESEARCH-2026-07.md §2).
    #
    # NOTE: the explicit NO knobs are the load-bearing guard. Stock
    # vmimage.subr touches ${DESTDIR}/firstboot in vm_create_disk AFTER
    # this hook runs (verified on releng/15.0 — same late-write class as
    # the msdosfs fstab line, docs/UR-BSD-VERIFY.md Finding 2), so the
    # sentinel rm below is defense-in-depth only and these rc.conf lines,
    # appended after vm_extra_enable_services' YES lines, win by ordering.
    cat >> "${DESTDIR}/etc/rc.conf" <<EOF
firstboot_pkg_upgrade_enable="NO"
firstboot_pkgs_enable="NO"
EOF
    # (a) firstboot(7) sentinels — defensive; see NOTE above
    rm -f "${DESTDIR}/firstboot" "${DESTDIR}/firstboot-reboot" 2>/dev/null || true
    # (c) the updater rc.d script itself, wherever a 15.1 rebase may put it
    rm -f "${DESTDIR}/usr/local/etc/rc.d/firstboot_pkg_upgrade" \
          "${DESTDIR}/usr/local/etc/rc.d/firstboot_pkgs" \
          "${DESTDIR}/etc/rc.d/firstboot_pkg_upgrade" 2>/dev/null || true

    # loader.conf: disable boot menu, use UART serial console (riscv64)
    # riscv QEMU virt machine: serial is the ns16550 uart0, not comconsole
    # (x86-specific); boot_serial not needed — firmware (OpenSBI +
    # u-boot/EDK2 EFI) handles console init before loader.efi runs.
    # UNVERIFIED: mirrors the arm64 conf; confirm on first riscv64 boot.
    cat >> "${DESTDIR}/boot/loader.conf" <<EOF
autoboot_delay="-1"
beastie_disable="YES"
loader_logo="none"
console="uart0"
EOF

    # sshd_config: allow password auth for initial access
    cat >> "${DESTDIR}/etc/ssh/sshd_config" <<EOF
PermitRootLogin yes
PasswordAuthentication yes
UsePAM no
EOF

    # Remove XMSS host keys — take hours to generate, block sshd startup
    rm -f "${DESTDIR}/etc/ssh/ssh_host_xmss_key"*

    # Fix /var/empty ownership — sshd requires root:wheel 0755
    chown root:wheel "${DESTDIR}/var/empty"
    chmod 0755 "${DESTDIR}/var/empty"

    # Fix filesystem ownership — build runs as non-root on macOS (UID != 0)
    # which causes ldconfig, PAM, and login to refuse to run.
    # Only chown paths that exist: mk-vmimage.sh runs under set -e, and a
    # single missing path here kills the image stage BEFORE makefs runs
    # (run #5: /usr/lib/compat is absent because the FIX-10 package list
    # excludes the compat/lib32 packages that ship it).
    for _p in etc etc/login.conf lib usr/lib usr/lib/compat; do
        if [ -e "${DESTDIR}/${_p}" ]; then
            chown root:wheel "${DESTDIR}/${_p}"
        fi
    done
    for _p in etc/pam.d usr/lib lib; do
        if [ -d "${DESTDIR}/${_p}" ]; then
            chown -R root:wheel "${DESTDIR}/${_p}"
        fi
    done

    # Pre-generate SSH host keys so sshd starts on first boot
    # (FreeBSD release images do not ship keys; generate with correct ownership)
    rm -f "${DESTDIR}/etc/ssh/ssh_host_rsa_key"* \
          "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key"* \
          "${DESTDIR}/etc/ssh/ssh_host_ed25519_key"*
    ssh-keygen -t ed25519 -f "${DESTDIR}/etc/ssh/ssh_host_ed25519_key" -N '' -q
    ssh-keygen -t ecdsa   -f "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key"   -N '' -q
    ssh-keygen -t rsa -b 3072 -f "${DESTDIR}/etc/ssh/ssh_host_rsa_key" -N '' -q
    chown root:wheel "${DESTDIR}/etc/ssh/ssh_host_"*
    chmod 600 "${DESTDIR}/etc/ssh/ssh_host_ed25519_key" \
              "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key" \
              "${DESTDIR}/etc/ssh/ssh_host_rsa_key"
    chmod 644 "${DESTDIR}/etc/ssh/ssh_host_ed25519_key.pub" \
              "${DESTDIR}/etc/ssh/ssh_host_ecdsa_key.pub" \
              "${DESTDIR}/etc/ssh/ssh_host_rsa_key.pub"

    # Set root password to 'smolfire' (change on first login)
    echo 'smolfire' | pw -V "${DESTDIR}/etc" usermod root -h 0 || true

    # Safety: refuse to rm -rf if DESTDIR is unset, empty, or the root filesystem.
    case "${DESTDIR:-}" in
        ""|"/") echo "vm_extra_pre_umount: DESTDIR='${DESTDIR:-}' is unsafe, aborting size-trim" >&2; return 1 ;;
    esac
    if [ ! -d "${DESTDIR}" ]; then
        echo "vm_extra_pre_umount: DESTDIR='${DESTDIR}' does not exist, aborting size-trim" >&2
        return 1
    fi

    # size-trim: strip non-essential rootfs content
    # Drop content the runtime VM doesn't need so the UFS image stays small.
    # Targets the 512 MiB qcow2 budget — see docs/PHASE-1-RESULTS.md.
    rm -rf "${DESTDIR}/usr/lib/debug"      # debug symbols (100s of MiB)
    rm -rf "${DESTDIR}/usr/share/doc"      # handbook, FAQ, READMEs
    rm -rf "${DESTDIR}/usr/share/locale"   # i18n catalogs (every locale)
    rm -rf "${DESTDIR}/usr/share/examples" # sample configs
    rm -rf "${DESTDIR}/usr/share/man"      # man pages (install on demand)
    rm -rf "${DESTDIR}/usr/tests"          # leftover test infra
    rm -rf "${DESTDIR}/var/cache/pkg"      # pkg(8) download cache
    rm -rf "${DESTDIR}/usr/include"        # headers (no compile in target VM)
    rm -f  "${DESTDIR}/usr/lib"/*.a        # static libs (we link dynamically)
    rm -rf "${DESTDIR}/rescue"             # static rescue tree (FreeBSD-rescue filtered, belt+braces)
    rm -rf "${DESTDIR}/boot/firmware"      # WiFi/NIC firmware blobs — no such hardware in QEMU
    rm -rf "${DESTDIR}/usr/lib/clang"      # clang runtime headers/libs (toolchain filtered)
    rm -rf "${DESTDIR}/usr/share/i18n"     # charmap/locale source data
    rm -rf "${DESTDIR}/usr/share/dict"     # wordlists
    rm -rf "${DESTDIR}/usr/share/games"    # fortunes etc.
    rm -rf "${DESTDIR}/usr/share/sendmail" # sendmail config sources
    rm -rf "${DESTDIR}/usr/share/openssl"  # openssl man pages (outside /usr/share/man)
    rm -rf "${DESTDIR}/var/db/etcupdate"   # etc merge source tree (no src upgrades in VM)

    # timezone strip: keep UTC variants + Etc (canonical UTC link target) — ~30-50 MiB savings
    if [ -d "${DESTDIR}/usr/share/zoneinfo" ]; then
        find "${DESTDIR}/usr/share/zoneinfo" -mindepth 1 -maxdepth 1 \
            ! -name UTC ! -name UTC0 ! -name UCT ! -name Etc \
            ! -name posixrules ! -name iso3166.tab ! -name zone.tab ! -name zone1970.tab \
            -exec rm -rf {} + 2>/dev/null || true
    fi
    rm -rf "${DESTDIR}/usr/share/nls"      2>/dev/null || true  # NLS message catalogs
    rm -rf "${DESTDIR}/usr/share/openssl"  2>/dev/null || true  # openssl docs
    rm -f  "${DESTDIR}/usr/bin/clang"*     2>/dev/null || true  # stray clang binaries
    rm -f  "${DESTDIR}/usr/bin/llvm"*      2>/dev/null || true  # stray llvm binaries

    # kernel module trim: remove modules unlikely needed in a minimal QEMU VM
    _km="${DESTDIR}/boot/kernel"
    for _mod in \
        bluetooth sound lindebugfs \
        netgraph geom_raid geom_mirror geom_stripe geom_label \
        if_bridge if_epair if_lagg if_vlan \
        ipfilter ipfw pf; do
        rm -f "${_km}/${_mod}.ko" "${_km}/${_mod}_load.ko" 2>/dev/null || true
    done

    # belt+braces: kernel symbols/debug files are never read at runtime
    # (kgdb post-mortem only); the -dbg sets are already excluded above.
    rm -f "${DESTDIR}/boot/kernel/"*.symbols "${DESTDIR}/boot/kernel/"*.debug 2>/dev/null || true
    # pkg repo catalogs are re-fetchable with `pkg update`; keep local.sqlite
    # so pkg info/query/check still work offline.
    rm -rf "${DESTDIR}/var/db/pkg/repos" 2>/dev/null || true
    rm -f  "${DESTDIR}/var/db/pkg/repo-"*.sqlite 2>/dev/null || true
    # static libs in /usr/lib subdirs missed by the top-level *.a rm above
    find "${DESTDIR}/usr/lib" -xdev -name '*.a' -delete 2>/dev/null || true

    # ---- round-2 diet (SIZEREPORT-driven; see docs/UR-BSD-VERIFY.md) -------
    # file(1) magic DB — ~12 MiB nobody consults in a boot-to-login VM
    rm -f "${DESTDIR}/usr/share/misc/magic.mgc" "${DESTDIR}/usr/share/misc/magic" 2>/dev/null || true
    # ZFS userland (~6 MiB libs + tools) on a UFS-only image whose kernel
    # has no ZFS; rm the tools too so no broken binaries remain
    rm -f "${DESTDIR}/lib/libzpool.so"* "${DESTDIR}/lib/libzfs"* \
          "${DESTDIR}/lib/libnvpair"* "${DESTDIR}/lib/libuutil"* \
          "${DESTDIR}/lib/libzutil"* "${DESTDIR}/lib/libicp"* \
          "${DESTDIR}/lib/libzfsbootenv"* \
          "${DESTDIR}/sbin/zfs" "${DESTDIR}/sbin/zpool" \
          "${DESTDIR}/usr/sbin/zdb" "${DESTDIR}/usr/sbin/bectl" 2>/dev/null || true
    # unused loader variants (~3 MiB): BIOS boots gptboot -> /boot/loader,
    # UEFI boots the ESP's loader.efi; the rest is dead weight (/boot/lua kept)
    rm -f "${DESTDIR}/boot/loader_4th.efi" "${DESTDIR}/boot/loader_simp.efi" \
          "${DESTDIR}/boot/loader.kboot" "${DESTDIR}/boot/loader_ia32.efi" \
          "${DESTDIR}/boot/userboot.so" "${DESTDIR}/boot/userboot_4th.so" \
          "${DESTDIR}/boot/userboot_simp.so" 2>/dev/null || true
    # misc from the largest-files list: tcpdump, hardware ID tables, OpenMP
    # runtime, sshd DH-GEX moduli (clients fall back to curve25519)
    rm -f "${DESTDIR}/usr/sbin/tcpdump" \
          "${DESTDIR}/usr/share/misc/pci_vendors" "${DESTDIR}/usr/share/misc/usb_vendors" \
          "${DESTDIR}/usr/lib/libomp.so"* \
          "${DESTDIR}/etc/ssh/moduli" 2>/dev/null || true

    # ---- SIZEREPORT: instrumentation only; must NEVER fail the build ------
    # mk-vmimage.sh runs under set -e (see the run #5 lesson above). The whole
    # block is the left side of an AND-OR list, which suppresses set -e for
    # every command inside it. Output lands in the make log
    # (/var/tmp/smolfire-build.log), which CI scp's out as smolfire-build-vm.log;
    # the next diet round reads it with: grep '^SIZEREPORT:'
    {
        echo "SIZEREPORT: ==== rootfs total (MiB) ===="
        du -xsm "${DESTDIR}" 2>/dev/null | sed 's/^/SIZEREPORT: /'
        echo "SIZEREPORT: ==== directories to depth 2 (MiB) ===="
        du -xm -d 2 "${DESTDIR}" 2>/dev/null | sort -rn | head -40 | sed 's/^/SIZEREPORT: /'
        echo "SIZEREPORT: ==== 30 largest files (KiB) ===="
        find "${DESTDIR}" -xdev -type f -exec du -kx {} + 2>/dev/null \
            | sort -rn | head -30 | sed 's/^/SIZEREPORT: /'
        echo "SIZEREPORT: ==== installed packages by size (bytes) ===="
        pkg -c "${DESTDIR}" query '%sb %n' 2>/dev/null | sort -rn | head -30 | sed 's/^/SIZEREPORT: /'
        echo "SIZEREPORT: ==== end ===="
    } || true

    return 0
}
