name: Publish Datadog lower-bound notebook

on:
  workflow_dispatch:
    inputs:
      notebook_id:
        description: Existing Datadog notebook ID to update; leave blank to create the notebook once.
        required: false
        type: string

jobs:
  publish:
    name: Render + publish notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Nushell
        run: |
          # Single source of truth for the Nushell version used by every workflow
          # and expected locally: .github/nu-version (bump it there, nowhere else).
          NU_VERSION="$(tr -d '[:space:]' < .github/nu-version)"
          # uname -m returns "arm64" on Apple Silicon; Nushell releases use "aarch64"
          ARCH=$(uname -m | sed 's/arm64/aarch64/')
          case "$(uname -s)" in
            Linux)  TRIPLE="${ARCH}-unknown-linux-musl" ;;
            Darwin) TRIPLE="${ARCH}-apple-darwin" ;;
          esac
          ARCHIVE="nu-${NU_VERSION}-${TRIPLE}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${ARCHIVE}" \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 "nu-${NU_VERSION}-${TRIPLE}/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify checked-in notebook payload
        run: nu bin/render-datadog-notebook.nu --check

      - name: Publish Datadog notebook
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DATADOG_API_SITE: ${{ vars.DATADOG_API_SITE }}
          DATADOG_APP_SITE: ${{ vars.DATADOG_APP_SITE }}
          NOTEBOOK_ID: ${{ inputs.notebook_id }}
        run: |
          if [ -n "$NOTEBOOK_ID" ]; then
            nu bin/publish-datadog-notebook.nu --notebook-id "$NOTEBOOK_ID"
          else
            nu bin/publish-datadog-notebook.nu
          fi
