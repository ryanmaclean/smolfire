# SPDX-License-Identifier: Apache-2.0
# hvf-verify.yml — boot the SHIPPED artifacts under macOS HVF.
#
# Probe run 35828986197 established (empirically, September 2026):
#   macos-15-intel : HVF WORKS (qemu -accel hvf machine-init passes)
#   macos-latest   : HVF blocked, HV_UNSUPPORTED (runner VM, no nested virt)
#   ubuntu-24.04-arm: no /dev/kvm
# So macos-15-intel is the one hosted target that can hardware-boot our
# amd64 artifacts — this closes the README's untested "-accel hvf on
# macOS" claim against the release bytes.
# TEMPORARY, self-triggering. Delete after results land in the ledger.

name: HVF verify shipped artifacts (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths: ['.github/workflows/hvf-verify.yml']

env:
  REL: https://github.com/ryanmaclean/smolfire/releases/download

jobs:
  hvf:
    runs-on: macos-15-intel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - name: Preflight — qemu + shipped artifacts
        run: |
          set -e
          brew install --quiet qemu coreutils 2>/dev/null || brew install qemu coreutils
          curl -fsSLO "$REL/0.3.0/smolbsd-amd64-0.3.0.qcow2"
          curl -fsSLO "$REL/0.3.0/SHA256SUMS-0.3.0"
          # SHA256SUMS-0.3.0 covers three assets; verify just the qcow2 line.
          grep 'smolbsd-amd64-0.3.0.qcow2' SHA256SUMS-0.3.0 | shasum -a 256 -c -
          curl -fsSLO "$REL/0.4.0/smolfire-kernel-0.4.0.gz"
          curl -fsSLO "$REL/0.4.0/SHA256SUMS-0.4.0"
          shasum -a 256 -c SHA256SUMS-0.4.0
          gunzip smolfire-kernel-0.4.0.gz

      - name: HVF boot gate — full image (q35, target <= 60s to login)
        run: |
          set -e
          expect -c '
            set timeout 90
            set t0 [clock seconds]
            spawn qemu-system-x86_64 -M q35 -accel hvf -m 512M -smp 2 \
              -drive file=smolbsd-amd64-0.3.0.qcow2,format=qcow2,if=virtio,snapshot=on \
              -nic user,model=virtio-net-pci -display none -serial mon:stdio
            expect {
              "login:"     { puts "\nHVF_IMAGE_TIME_TO_LOGIN=[expr [clock seconds]-$t0]s\nHVF_IMAGE_VERDICT=pass"; exit 0 }
              "mountroot>" { puts "\nHVF_IMAGE_VERDICT=fail (mountroot)"; exit 2 }
              "panic"      { expect -timeout 5 timeout; puts "\nHVF_IMAGE_VERDICT=fail (panic — text above)"; exit 2 }
              timeout      { puts "\nHVF_IMAGE_VERDICT=fail (no login in 90s)"; exit 1 }
              eof          { puts "\nHVF_IMAGE_VERDICT=fail (qemu exited)"; exit 2 }
            }'

      - name: HVF boot gate — SMOLFIRE one-ELF (microvm PVH)
        run: |
          set -e
          expect -c '
            set timeout 60
            set t0 [clock milliseconds]
            spawn qemu-system-x86_64 -M microvm -accel hvf -m 512M \
              -kernel smolfire-kernel-0.4.0 \
              -append "hint.acpi.0.disabled=0 machdep.disable_tsc_calibration=0" \
              -display none -serial mon:stdio
            expect {
              "SMOLFIRE_READY" {
                puts "\nHVF_FIRE_TIME_TO_READY=[expr [clock milliseconds]-$t0]ms"
                send {echo FIRE_$((6*7))}
                send "\r"
                expect {
                  "FIRE_42" { puts "\nHVF_FIRE_VERDICT=pass (interactive shell under HVF)"; exit 0 }
                  timeout   { puts "\nHVF_FIRE_VERDICT=fail (shell unresponsive)"; exit 1 }
                }
              }
              "panic"   { expect -timeout 5 timeout; puts "\nHVF_FIRE_VERDICT=fail (panic — text above)"; exit 2 }
              timeout   { puts "\nHVF_FIRE_VERDICT=fail (no READY in 60s)"; exit 1 }
              eof       { puts "\nHVF_FIRE_VERDICT=fail (qemu exited)"; exit 2 }
            }'
