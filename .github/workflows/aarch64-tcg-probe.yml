# SPDX-License-Identifier: Apache-2.0
# aarch64-tcg-probe.yml — measure same-ISA TCG aarch64 boot time on the
# ubuntu-24.04-arm hosted runner (design: backlog panel wf_126b3fff-e69;
# the ledger's >480s TCG figure was cross-ISA x64→aarch64 and says nothing
# about aarch64-on-aarch64, which is UNMEASURED — this probe measures it).
#
# TEMPORARY, self-triggering, report-only (runner-probe.yml pattern):
# every boot step is continue-on-error; the JOB LOG + step summary are the
# deliverable. EXIT CONDITION: delete this file after the measured numbers
# land in docs/UR-BSD-VERIFY.md; the retirement commit cites the run ID.
#
# No smolfire aarch64 qcow2 has ever been built (verified via the artifacts
# API — run 12 produced a kernel tarball only), so the expected path today
# is the stock FreeBSD 15.0 arm64 BASIC-CLOUDINIT image: a GENERIC-kernel
# UPPER BOUND that validates firmware paths, marker strings, and the qemu
# invocation, and informs — but never sets — the soft-gate budget.

name: aarch64 same-ISA TCG probe (one-shot)

on:
  push:
    branches: ['claude/ur-bsd-26-qnmjho']
    paths:
      - '.github/workflows/aarch64-tcg-probe.yml'
      - 'bin/ci/aarch64-boot-probe.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  STOCK_URL: https://download.freebsd.org/releases/VM-IMAGES/15.0-RELEASE/aarch64/Latest/FreeBSD-15.0-RELEASE-arm64-aarch64-BASIC-CLOUDINIT-ufs.qcow2.xz
  BOOT_BUDGET: "1200"

jobs:
  probe:
    name: TCG boot probe (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    # 2 boots x 1200s = 40 min worst case + ~560 MB download/unxz + apt:
    # 90 min so the exact outcome the probe exists to detect (both legs
    # exhausting their budget) still reports instead of being job-killed.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install qemu + AAVMF firmware
        run: |
          sudo apt-get update -qq
          # qemu-efi-aarch64 listed explicitly: --no-install-recommends drops
          # it, and it ships /usr/share/AAVMF/AAVMF_{CODE,VARS}.fd
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils qemu-efi-aarch64 expect xz-utils
          qemu-system-aarch64 --version | head -1
          ls -l /usr/share/AAVMF

      - name: Image acquisition — smolfire artifact else stock fallback
        env:
          # gh needs the token EXPORTED; permissions: actions:read scopes it
          # but does not export it (verified failure mode from design review)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FOUND=""
          if ART=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=smolfire-aarch64&per_page=10" \
                     --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty' 2>gh.err); then
            if [ -n "$ART" ]; then
              ID=$(echo "$ART" | jq -r .id)
              echo "PROBE: source=smolfire artifact id=$ID (lookup ok, artifact exists)"
              gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > art.zip
              unzip -o art.zip
              mv smolfire-aarch64.qcow2 probe.qcow2
              FOUND=1
            else
              echo "PROBE: source-decision: lookup ok, NO unexpired smolfire-aarch64 image artifact exists — falling back to stock"
            fi
          else
            echo "PROBE: source-decision: artifact lookup FAILED (token/api — see below), falling back to stock; this is NOT evidence the artifact is absent"
            cat gh.err || true
          fi
          if [ -z "$FOUND" ]; then
            echo "PROBE: source=stock (GENERIC kernel — upper-bound proxy; first-boot cloud-init/growfs work included)"
            curl -fsSL -o probe.qcow2.xz "$STOCK_URL"
            unxz probe.qcow2.xz
          fi
          qemu-img info probe.qcow2

      - name: 'Boot 1: -cpu max,pauth-impdef=on (FEAT_RNG present)'
        id: boot_max
        continue-on-error: true
        run: |
          SERIAL_LOG="$PWD/serial-max.log" \
            sh bin/ci/aarch64-boot-probe.sh probe.qcow2 "$BOOT_BUDGET" "max,pauth-impdef=on" | tee boot-max.out
          rc=${PIPESTATUS[0]}
          # summary appended per-boot so a job-kill can't eat earlier results
          {
            echo "### Boot 1: -cpu max,pauth-impdef=on"
            grep -E "VERDICT=|TIME_TO_LOGIN=|MARKER=|QEMU_EXIT" boot-max.out | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: 'Boot 2: -cpu neoverse-n1 (no FEAT_RNG — entropy-stall leg)'
        id: boot_n1
        continue-on-error: true
        run: |
          SERIAL_LOG="$PWD/serial-n1.log" \
            sh bin/ci/aarch64-boot-probe.sh probe.qcow2 "$BOOT_BUDGET" neoverse-n1 | tee boot-n1.out
          rc=${PIPESTATUS[0]}
          {
            echo "### Boot 2: -cpu neoverse-n1"
            grep -E "VERDICT=|TIME_TO_LOGIN=|MARKER=|QEMU_EXIT" boot-n1.out | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload serial transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-tcg-probe-serial
          if-no-files-found: warn
          path: |
            serial-max.log
            serial-n1.log
            boot-max.out
            boot-n1.out
