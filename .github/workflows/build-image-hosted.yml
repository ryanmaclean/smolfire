# SPDX-License-Identifier: Apache-2.0
# build-image-hosted.yml — Build the qcow2 compatibility image on a
# GitHub-hosted runner.
#
# No self-hosted infrastructure required: standard GitHub Linux x64 runners
# expose /dev/kvm (nested virtualization), so we boot a stock FreeBSD
# 15.0-RELEASE BASIC-CLOUDINIT VM under KVM, build world+kernel+image inside
# it (FIX-9 cloudware-release path), scp the artifact out, and run the size
# and boot gates on the runner itself.
#
# vs build-image.yml (PATH B, self-hosted): same nested-VM strategy, but the
# base image is downloaded instead of pre-staged, /usr/src is shallow-cloned
# inside the VM, and root SSH access is bootstrapped with a NoCloud cloud-init
# seed (FreeBSD nuageinit) instead of a pre-configured password image.
#
# Legs:
#   amd64   — full: build + size gate + KVM boot gate.
#   aarch64 — cross-built from the same amd64 FreeBSD VM (TARGET/TARGET_ARCH
#             handled by bin/build-smolfire-vm.nu base_make_args). Size gate
#             + same-ISA TCG boot SOFT-gate (aarch64-boot-softgate job below,
#             runs-on ubuntu-24.04-arm). No hosted runner hardware-accelerates
#             an aarch64 guest (ledger: Runner capability map); the >480s
#             TCG figure (docs/PHASE-1-RESULTS.md) was CROSS-ISA on an x64
#             host and does not apply to the ARM runner. Soft-gate verdict
#             semantics + recalibration exit condition: see the job comment.
#   riscv64 — size gate only (experimental; docs/BUILDING.md).
#
# Timing: buildworld -j4 inside a KVM guest is ~2.5-4 h; job timeout is set
# just under the 6 h hosted-runner ceiling. If this proves too tight, the
# options are a larger runner (more cores), a ccache'd obj tree, or the
# self-hosted pipeline.

name: Build smolfire qcow2 compatibility image

permissions:
  contents: read
  actions: read   # reassemble_from_run: read the source run + download its artifact (same repo)

# (Post-rename revalidation: run 35834636637 GREEN 2026-09-23 — SMOLFIRE-VM
# kernel ident, hostname smolfire, 66.6 MiB raw / 26.6 MiB compressed,
# size + KVM boot gates PASS, 8s to login. Temp push trigger retired.)
on:
  # (aarch64 leg validated end-to-end: run 35947103487 GREEN 2026-09-24 —
  # 28-min build with the 4088910 trim-knob set minus WITHOUT_INSTALLLIB,
  # 63.1 MiB raw / 24.9 MiB compressed, size gate PASS, TCG soft-gate
  # VERDICT=pass TIME_TO_LOGIN=31s attempt 1. Arch fallbacks reverted to
  # amd64.)
  # (Trim-knob set + round-3 utilities cut validated on amd64: runs
  # 35955339464 (knobs, 35 min, KVM boot gate 10s) and 35959282125
  # (cut: LDDCHECK PASS, 62.6/25.0 MiB, boot 9s). Temp trigger retired.)
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        type: choice
        options: [amd64, aarch64, riscv64]
        default: amd64
      vmsize:
        description: "Image VMSIZE (sparse)"
        default: "2g"
      kernconf:
        description: "KERNCONF under sys/<arch>/conf (e.g. SMOLFIRE-VM-TSLOG, the aarch64 TSLOG measurement kernel)"
        default: "SMOLFIRE-VM"
      kernel_only:
        description: "Kernel only: kernel-toolchain + buildkernel + installkernel, upload boot/kernel tarball; no world, no image, no gates (~1.5 h vs ~3.5 h)"
        type: boolean
        default: false
      softgate_mode:
        description: "aarch64 TCG boot gate: soft (inconclusive = warning, default) or hard (inconclusive after retry = RED). See RECALIBRATION in the aarch64-boot-softgate job."
        type: choice
        options: [soft, hard]
        default: soft
      softgate_budget:
        description: "aarch64 TCG boot gate login budget, seconds (default 900; recalibration target ~2x p95 TIME_TO_LOGIN)"
        default: "900"
      emit_reassemble:
        description: "Also upload the reusable pkgbase products (artifact smolfire-reassemble-<arch>-<kernconf>, 7-day retention) so a later config-only change can use reassemble_from_run. Opt-in: costs artifact storage"
        type: boolean
        default: false
      reassemble_from_run:
        description: "Reassemble: numeric id of a GREEN run of this workflow that ran with emit_reassemble (same arch + kernconf). Skips buildworld+buildkernel and only re-runs cloudware-release + gates (~15 min vs ~35). Refused if src.conf/kernconf changed. Empty = full build"
        default: ""
  # (Rename phase-3b temporary push trigger retired after run #9 went green:
  #  smolfire.ufs.qcow2 built via CLOUDWARE=smolfire + KERNCONF=SMOLFIRE-VM,
  #  size gate and KVM boot gate passed with the new root password.)
  # (Round-4 temporary push trigger retired after the round-2 diet build
  # went green — raw 66.6 MiB, compressed 26.6 MiB, 9s boot, run
  # 30375142187. Pre-merge validation without dispatch rights: re-add a
  # push trigger scoped to the branch, or a human runs
  #   gh workflow run build-image-hosted.yml --ref <branch>)

env:
  WORK: /mnt/smolfire-ci
  SSH_PORT: "2252"
  SRC_BRANCH: releng/15.0
  BASE_URL: https://download.freebsd.org/releases/VM-IMAGES/15.0-RELEASE/amd64/Latest
  BASE_IMG: FreeBSD-15.0-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2

jobs:
  build:
    name: Build smolfire compatibility ${{ inputs.arch || 'amd64' }} ${{ inputs.kernel_only && format('kernel {0}', inputs.kernconf) || 'qcow2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash   # explicit shell => bash -eo pipefail (tee must not mask failures)

    steps:
      - uses: actions/checkout@v4

      # ---- Reassemble mode (opt-in; every "Reassemble —" step is skipped when
      # neither reassemble input is set, leaving the default pipeline as-is).
      # Arg/plumbing/validation logic is Nushell: bin/reassemble-plan.nu,
      # tests/reassemble-plan-test.nu. Design: docs/BUILDING.md "Reassemble mode".
      - name: Reassemble — plan and validate source run
        id: rplan
        if: ${{ inputs.reassemble_from_run != '' || inputs.emit_reassemble }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_INPUT: ${{ inputs.reassemble_from_run }}
          EMIT_INPUT: ${{ inputs.emit_reassemble }}
          KONLY_INPUT: ${{ inputs.kernel_only }}
          ARCH_INPUT: ${{ inputs.arch || 'amd64' }}
          KERNCONF_INPUT: ${{ inputs.kernconf || 'SMOLFIRE-VM' }}
        run: |
          set -e
          NU_VERSION="$(tr -d '[:space:]' < .github/nu-version)"
          TRIPLE="x86_64-unknown-linux-musl"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-${TRIPLE}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 "nu-${NU_VERSION}-${TRIPLE}/nu"
          export PATH="$HOME/.local/bin:$PATH"
          nu --version
          ARGS=(--reassemble-from-run "$RUN_INPUT" --arch "$ARCH_INPUT" --kernconf "$KERNCONF_INPUT")
          [ "$EMIT_INPUT" = "true" ] && ARGS+=(--emit)
          [ "$KONLY_INPUT" = "true" ] && ARGS+=(--kernel-only)
          nu bin/reassemble-plan.nu plan "${ARGS[@]}" | tee plan.out
          cat plan.out >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_INPUT" ]; then
            gh run view "$RUN_INPUT" --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion,workflowName,databaseId > source-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_INPUT/artifacts?per_page=100" > source-artifacts.json
            nu bin/reassemble-plan.nu validate-source --run source-run.json --artifacts source-artifacts.json \
              --arch "$ARCH_INPUT" --kernconf "$KERNCONF_INPUT" --this-run "$GITHUB_RUN_ID" | tee validate.out
            # artifact_id (exact id of the artifact that was validated) feeds the download step
            cat validate.out >> "$GITHUB_OUTPUT"
            {
              echo "### reassemble from run $RUN_INPUT"
              sed 's/^/    /' validate.out
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preflight — KVM, disk, packages
        run: |
          set -e
          test -c /dev/kvm || {
            echo "ERROR: /dev/kvm not available on this runner."
            echo "Hosted x64 Linux runners expose KVM; arm64 runners do not."
            exit 1
          }
          # Hosted runners ship /dev/kvm as root:kvm 0660 and the runner user
          # is not in the kvm group — qemu fails with EPERM without this
          # (first run proved it). Same reason build-image.yml uses sudo qemu.
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm && echo "/dev/kvm writable"
          # /mnt has the large free space on hosted runners (~60 GB); the
          # in-VM scratch disk and base image live there.
          sudo mkdir -p "$WORK" && sudo chown "$(id -u)" "$WORK"
          df -h / /mnt
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils expect xz-utils genisoimage openssh-client

      - name: Reassemble — download source run products
        if: ${{ inputs.reassemble_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          # exact id of the artifact validate-source checked (size/expiry), not "by name"
          artifact-ids: ${{ steps.rplan.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.reassemble_from_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ env.WORK }}/reassemble

      - name: Fetch FreeBSD 15.0 base image
        run: |
          set -e
          cd "$WORK"
          curl -fsSL -o base.qcow2.xz "$BASE_URL/$BASE_IMG.xz"
          unxz base.qcow2.xz
          # growfs_enable in the official image expands the rootfs to fill
          # the resized disk on first boot; buildworld needs the headroom.
          qemu-img resize base.qcow2 60G
          qemu-img info base.qcow2

      - name: Create cloud-init NoCloud seed (root SSH key)
        run: |
          set -e
          cd "$WORK"
          ssh-keygen -t ed25519 -N '' -f ci_key -q
          printf 'instance-id: smolfire-ci\nlocal-hostname: smolfire-build\n' > meta-data
          {
            echo '#cloud-config'
            echo 'users:'
            echo '  - name: root'
            echo '    ssh_authorized_keys:'
            echo "      - $(cat ci_key.pub)"
            # FreeBSD sshd defaults to PermitRootLogin no and neither the
            # BASIC-CLOUDINIT conf nor nuageinit changes it — without this the
            # key is installed but every root login is refused.
            echo 'runcmd:'
            echo "  - echo 'PermitRootLogin prohibit-password' >> /etc/ssh/sshd_config"
            echo '  - service sshd restart || true'
          } > user-data
          genisoimage -output seed.iso -volid cidata -joliet -rock user-data meta-data

      - name: Boot FreeBSD build VM (KVM)
        run: |
          set -e
          cd "$WORK"
          qemu-img create -f qcow2 scratch.qcow2 40G   # /usr/obj overflow space
          qemu-system-x86_64 \
            -M q35 -accel kvm -cpu host \
            -smp "$(nproc)" -m 12G \
            -drive file=base.qcow2,format=qcow2,if=virtio \
            -drive file=scratch.qcow2,format=qcow2,if=virtio \
            -cdrom seed.iso \
            -nic "user,model=virtio-net-pci,hostfwd=tcp::${SSH_PORT}-:22" \
            -display none -daemonize \
            -serial "file:${WORK}/serial.log" \
            -pidfile "${WORK}/vm.pid"

          # First boot runs growfs and firstboot_freebsd_update before sshd
          # comes up — allow 10 minutes.
          echo "Waiting for SSH (cloud-init key auth) ..."
          for i in $(seq 1 120); do
            if ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=3 -o BatchMode=yes -p "$SSH_PORT" \
                   root@127.0.0.1 'echo VM_UP && uname -rm'; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: SSH never came up. Serial console tail:"
          tail -50 serial.log
          exit 1

      - name: Prepare VM — packages, src tree, repo
        run: |
          set -e
          cd "$WORK"
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          # Scratch disk -> /usr/obj (buildworld writes 15-40 GB of objects)
          $SSH 'gpart create -s gpt vtbd1 && gpart add -t freebsd-ufs vtbd1 && \
                newfs -U /dev/vtbd1p1 && mkdir -p /usr/obj && \
                mount /dev/vtbd1p1 /usr/obj'
          $SSH 'env ASSUME_ALWAYS_YES=yes pkg update -q && \
                env ASSUME_ALWAYS_YES=yes pkg install -y git nushell'
          # Shallow clone keeps this ~10x smaller/faster than a full checkout.
          $SSH "git clone --depth 1 -b $SRC_BRANCH https://git.freebsd.org/src.git /usr/src"
          # Ship the smolfire repo (kernconfs, release confs, build pipeline).
          tar -C "$GITHUB_WORKSPACE" -cf - . | $SSH 'mkdir -p /root/smolfire && tar -C /root/smolfire -xf -'
          # Install the whole SMOLFIRE* kernconf family for every arch:
          # *-TSLOG variants `include` their base conf (mirrors smolfire.yml).
          $SSH 'for d in amd64 arm64 riscv; do
                  cp /root/smolfire/sys/$d/conf/SMOLFIRE* /usr/src/sys/$d/conf/ 2>/dev/null || true
                done; ls /usr/src/sys/*/conf/SMOLFIRE*'

      - name: Reassemble — ship products into the VM
        if: ${{ inputs.reassemble_from_run != '' }}
        run: |
          set -e
          cd "$WORK"
          ls -l reassemble/
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          $SSH 'mkdir -p /var/tmp/reassemble'
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" reassemble/manifest.json reassemble/reassemble-products.tar \
              root@127.0.0.1:/var/tmp/reassemble/
          # FATAL: /usr/src must be exactly the commit the packages were built
          # from (unpack re-checks it against the manifest and refuses on any
          # mismatch). A failed pin means a full build is required.
          SRC_COMMIT=$(grep -o '"src_commit": *"[0-9a-f]*"' reassemble/manifest.json | grep -o '[0-9a-f]\{7,40\}' || true)
          if [ -z "$SRC_COMMIT" ]; then
            echo "::error::manifest carries no src_commit; a full build is required"; exit 1
          fi
          $SSH "cd /usr/src && git fetch --depth 1 origin $SRC_COMMIT && git checkout -q FETCH_HEAD" \
            && echo "src pinned to $SRC_COMMIT" \
            || { echo "::error::could not pin /usr/src to $SRC_COMMIT; a full build is required"; exit 1; }
          # The checkout above must not clobber the smolfire kernconfs (untracked, kept).

      - name: Build kernel only (kernel-toolchain + buildkernel) inside VM
        if: ${{ inputs.kernel_only }}
        env:
          ARCH_INPUT: ${{ inputs.arch || 'amd64' }}
          KERNCONF_INPUT: ${{ inputs.kernconf || 'SMOLFIRE-VM' }}
        run: |
          set -e
          cd "$WORK"
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          case "$ARCH_INPUT" in
            amd64)   T="" ;;   # native on the amd64 build VM
            aarch64) T="TARGET=arm64 TARGET_ARCH=aarch64" ;;
            riscv64) T="TARGET=riscv TARGET_ARCH=riscv64" ;;
            *) echo "unknown arch $ARCH_INPUT"; exit 1 ;;
          esac
          case "$KERNCONF_INPUT" in *[!A-Za-z0-9_-]*) echo "bad kernconf"; exit 1 ;; esac
          # One remote sh (fed on stdin, so root's login shell does not
          # matter): toolchain, kernel, staged install. Per-stage seconds are
          # echoed so the wall time is attributable from the job summary.
          cat > kbuild.sh <<EOF
          set -e
          L=/var/tmp/smolfire-build.log; NJ=\$(sysctl -n hw.ncpu)
          t0=\$(date +%s); echo "kernel-toolchain start \$(date -u +%FT%TZ) -j\$NJ $T"
          make -C /usr/src -j\$NJ $T kernel-toolchain >>\$L 2>&1
          t1=\$(date +%s); echo "kernel-toolchain done \$((t1-t0))s"
          make -C /usr/src -j\$NJ $T buildkernel KERNCONF=$KERNCONF_INPUT >>\$L 2>&1
          t2=\$(date +%s); echo "buildkernel done \$((t2-t1))s"
          rm -rf /var/tmp/kinst && mkdir -p /var/tmp/kinst
          make -C /usr/src $T installkernel KERNCONF=$KERNCONF_INPUT DESTDIR=/var/tmp/kinst >>\$L 2>&1
          tar -C /var/tmp/kinst -cf /var/tmp/kernel.tar boot
          ls -l /var/tmp/kinst/boot/kernel
          echo "KERNEL_BUILD_SECS=\$((\$(date +%s)-t0))"
          EOF
          BUILD_RC=0
          $SSH 'sh -s' < kbuild.sh \
            2>&1 | tee build.log || BUILD_RC=$?
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/var/tmp/smolfire-build.log \
              "$WORK/smolfire-build-vm.log" || true
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "ERROR: kernel build rc=$BUILD_RC"; tail -n 150 "$WORK/smolfire-build-vm.log" || true; exit 1
          fi
          OUT="$WORK/smolfire-kernel-${ARCH_INPUT}-${KERNCONF_INPUT}.tar"
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/var/tmp/kernel.tar "$OUT"
          ls -lh "$OUT"; tar -tvf "$OUT" | head -20
          {
            echo "### kernel-only build (${ARCH_INPUT}, ${KERNCONF_INPUT})"
            grep -E 'done|KERNEL_BUILD_SECS' build.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (world + kernel + cloudware-release) inside VM
        if: ${{ !inputs.kernel_only }}
        env:
          VMSIZE_INPUT: ${{ inputs.vmsize || '2g' }}
          KERNCONF_INPUT: ${{ inputs.kernconf || 'SMOLFIRE-VM' }}
          REASSEMBLE_FLAGS: ${{ steps.rplan.outputs.build_flags }}   # empty unless reassemble_from_run is set
        run: |
          set -e
          cd "$WORK"
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          # Run the build but judge success by the ARTIFACT, not the script exit
          # code: run #3 built the image, then died in post-build artifact
          # location (a nu bug) and the qcow2 was lost with the ephemeral VM.
          BUILD_RC=0
          $SSH "cd /root/smolfire && nu bin/build-smolfire-vm.nu \
                  --arch '${{ inputs.arch || 'amd64' }}' --vmsize '$VMSIZE_INPUT' \
                  --kernconf '$KERNCONF_INPUT'${REASSEMBLE_FLAGS:+ $REASSEMBLE_FLAGS}" \
            2>&1 | tee build.log || BUILD_RC=$?
          # Locate the artifact (FIX-9: cloudware-release writes
          # <objdir>/usr/src/release/smolfire.ufs.qcow2)
          # Always pull the in-VM make log out — the real error lives there
          # and dies with the ephemeral VM otherwise (runs #3/#4 lesson).
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" root@127.0.0.1:/var/tmp/smolfire-build.log \
              "$WORK/smolfire-build-vm.log" || true
          ART=$($SSH "find /usr/obj -name smolfire.ufs.qcow2 2>/dev/null | head -1")
          [ -n "$ART" ] || ART=$($SSH "find /usr/obj -name '*.ufs.qcow2' 2>/dev/null | head -1")
          if [ -z "$ART" ]; then
            echo "ERROR: no qcow2 artifact found in /usr/obj (build rc=$BUILD_RC)"
            echo "==== tail of in-VM make log ===="
            tail -n 150 "$WORK/smolfire-build-vm.log" || true
            exit 1
          fi
          [ "$BUILD_RC" -eq 0 ] || echo "WARNING: build script exited rc=$BUILD_RC after producing the artifact - check build.log"
          echo "artifact=$ART"
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" "root@127.0.0.1:$ART" \
              "$WORK/smolfire-${{ inputs.arch || 'amd64' }}.qcow2"
          ls -lh "$WORK/smolfire-${{ inputs.arch || 'amd64' }}.qcow2"

      - name: Reassemble — pack reusable products (emit_reassemble)
        id: rpack
        if: ${{ inputs.emit_reassemble && !inputs.kernel_only }}
        continue-on-error: true   # optional product: never fail the image build over it
        run: |
          set -e
          cd "$WORK"
          SSH="ssh -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
               -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p $SSH_PORT root@127.0.0.1"
          $SSH "cd /root/smolfire && nu bin/reassemble-plan.nu pack --arch '${{ inputs.arch || 'amd64' }}' \
                  --kernconf '${{ inputs.kernconf || 'SMOLFIRE-VM' }}' --out-dir /var/tmp/reassemble-out \
                  --src-commit \$(git -C /usr/src rev-parse HEAD) --smolfire-sha '$GITHUB_SHA'" | tee pack.out
          mkdir -p reassemble-out
          scp -i ci_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -P "$SSH_PORT" "root@127.0.0.1:/var/tmp/reassemble-out/*" reassemble-out/
          ls -l reassemble-out
          {
            echo "### reassemble products (measured)"
            sed 's/^/    /' pack.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compress qcow2 (in place)
        if: ${{ !inputs.kernel_only }}
        run: |
          set -e
          ARCH="${{ inputs.arch || 'amd64' }}"
          RAW="$WORK/smolfire-${ARCH}.qcow2"
          RAW_BYTES=$(wc -c < "$RAW")
          # Per-cluster zlib compression: read-transparent to every qemu that
          # can open qcow2. Deliberately NOT zstd (-o compression_type=zstd),
          # which requires qemu >= 5.1 in every downstream consumer.
          # The size gate, boot gate, upload, and release asset all reference
          # this path, so replacing in place needs no other workflow changes;
          # the boot gate opens it read-only (snapshot=on) so the write path
          # never touches compressed clusters.
          qemu-img convert -c -O qcow2 -o compat=1.1 "$RAW" "$RAW.c.tmp"
          qemu-img check "$RAW.c.tmp"
          # Bit-for-bit guest-content equality before replacing the artifact.
          qemu-img compare -f qcow2 -F qcow2 "$RAW" "$RAW.c.tmp"
          mv -f "$RAW.c.tmp" "$RAW"
          COMP_BYTES=$(wc -c < "$RAW")
          # Raw bytes stay visible every run: the size trend in
          # docs/PHASE-1-RESULTS.md / UR-BSD-VERIFY.md is tracked in raw
          # bytes, and compression must not mask raw-image growth.
          echo "raw_bytes=$RAW_BYTES compressed_bytes=$COMP_BYTES"
          {
            echo "### qcow2 compression (${ARCH})"
            echo "| raw MiB | compressed MiB |"
            echo "|---|---|"
            echo "| $((RAW_BYTES / 1048576)) | $((COMP_BYTES / 1048576)) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Size gate (<= 512 MiB)
        id: size
        if: ${{ !inputs.kernel_only }}
        continue-on-error: true   # deferred: enforced after the boot gate below
        run: |
          BYTES=$(wc -c < "$WORK/smolfire-${{ inputs.arch || 'amd64' }}.qcow2")
          LIMIT=536870912
          echo "artifact: $BYTES bytes; limit: $LIMIT bytes"
          if [ "$BYTES" -le "$LIMIT" ]; then
            echo "SIZE GATE: PASS ($((BYTES / 1048576)) MiB <= 512 MiB)"
          else
            echo "SIZE GATE: FAIL (over by $(((BYTES - LIMIT) / 1048576)) MiB)"
            exit 1
          fi

      - name: Boot gate (KVM, amd64 only)
        if: ${{ !inputs.kernel_only && (inputs.arch || 'amd64') == 'amd64' }}
        run: |
          set -e
          cd "$WORK"
          # aarch64 is skipped HERE because this job is x64 (cross-ISA TCG
          # is the >480s PHASE-1 case); its boot check is the same-ISA TCG
          # soft-gate job (aarch64-boot-softgate) on ubuntu-24.04-arm.
          expect -c '
            set timeout 60
            set t0 [clock seconds]
            spawn qemu-system-x86_64 -M q35 -accel kvm -cpu host -m 512M -smp 2 \
              -drive file='"$WORK"'/smolfire-amd64.qcow2,format=qcow2,if=virtio,snapshot=on \
              -nic user,model=virtio-net-pci -display none -serial mon:stdio
            expect {
              "login:"        { puts "\nTIME_TO_LOGIN=[expr [clock seconds]-$t0]s\nVERDICT=pass"; exit 0 }
              "mountroot>"    { puts "\nVERDICT=fail (mountroot — see UR-BSD-VERIFY Finding 2)"; exit 2 }
              "panic"         { puts "\nVERDICT=fail (kernel panic)"; exit 2 }
              timeout         { puts "\nVERDICT=fail (no login within 60s)"; exit 1 }
              eof             { puts "\nVERDICT=fail (qemu exited)"; exit 2 }
            }'

      - name: Enforce size gate
        if: ${{ steps.size.outcome == 'failure' }}
        run: |
          echo "Size gate failed (see 'Size gate' step) — failing the job now that the boot gate has reported."
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smolfire-${{ inputs.arch || 'amd64' }}${{ inputs.kernel_only && format('-kernel-{0}', inputs.kernconf) || '' }}
          if-no-files-found: warn
          path: |
            /mnt/smolfire-ci/smolfire-*.qcow2
            /mnt/smolfire-ci/smolfire-kernel-*.tar
            /mnt/smolfire-ci/build.log
            /mnt/smolfire-ci/smolfire-build-vm.log
            /mnt/smolfire-ci/serial.log

      - name: Reassemble — upload reusable products
        if: ${{ inputs.emit_reassemble && !inputs.kernel_only && steps.rpack.outcome == 'success' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rplan.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0   # *.pkg are already compressed
          path: |
            /mnt/smolfire-ci/reassemble-out/reassemble-products.tar
            /mnt/smolfire-ci/reassemble-out/manifest.json

      - name: Teardown VM
        if: always()
        run: |
          [ -f "$WORK/vm.pid" ] && sudo kill "$(cat "$WORK/vm.pid")" 2>/dev/null || true

  # aarch64 boot SOFT-gate: same-ISA TCG on the ARM hosted runner.
  # Design + review: backlog panel wf_126b3fff-e69; ledger "Runner
  # capability map" — no hosted runner hardware-accelerates an aarch64
  # guest, and the >480s TCG figure was cross-ISA (x64 host). Same-ISA
  # TCG is measured by .github/workflows/aarch64-tcg-probe.yml.
  #
  # Verdict semantics (bin/ci/aarch64-boot-probe.sh contract):
  #   pass (exit 0)             — login: within budget; job green.
  #   fail-definitive (exit 2)  — guest-emitted panic/mountroot>; TCG
  #                               slowness can never produce these, so
  #                               the job goes RED (a broken image is a
  #                               finding, not a gate defect).
  #   inconclusive (exit 3/4)   — budget exhausted or host-side qemu
  #                               death: retried ONCE; if still
  #                               inconclusive, ::warning + green — the
  #                               image is NOT verified broken, and NOT
  #                               verified booting; gate-verdict.txt
  #                               records which, so an inconclusive
  #                               qcow2 is never laundered as tested.
  #
  # RECALIBRATION (exit condition from soft mode): after 3 measured
  # runs, if p95 TIME_TO_LOGIN < 300s, tighten the budget to ~2x p95
  # and promote timeout to hard fail; if runs consistently exhaust the
  # budget while progressing (markers advance), record TCG-unviable in
  # the ledger — the hard aarch64 boot gate then formally stays on the
  # self-hosted-ARM/owner-hardware path. Cite measuring run IDs here.
  # Measured so far (same-ISA, ubuntu-24.04-arm): runs 35947103487 = 31s,
  # 35965919427 = 30s (2 of the 3 required points). Promotion is wired but
  # OFF: dispatch with softgate_mode=hard softgate_budget=<~2x p95, i.e.
  # ~90> (or set repo vars SOFTGATE_MODE/SOFTGATE_BUDGET) once the third
  # run is in; revert by unsetting. timeout-minutes (45) assumes budget
  # <= ~1200s.
  aarch64-boot-softgate:
    name: aarch64 boot soft-gate (same-ISA TCG)
    needs: build
    if: ${{ !inputs.kernel_only && (inputs.arch || 'amd64') == 'aarch64' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45   # worst case 2x900s boots + setup ~= 35 min
    env:
      # Reversible promotion switch (RECALIBRATION above). Defaults keep the
      # documented soft behaviour; flip per-dispatch via inputs, or
      # repo-wide via Actions variables SOFTGATE_MODE / SOFTGATE_BUDGET.
      SOFTGATE_MODE: ${{ inputs.softgate_mode || vars.SOFTGATE_MODE || 'soft' }}
      SOFTGATE_BUDGET: ${{ inputs.softgate_budget || vars.SOFTGATE_BUDGET || '900' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu + AAVMF firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-utils qemu-efi-aarch64 expect
          qemu-system-aarch64 --version | head -1

      - name: Fetch this run's aarch64 image
        uses: actions/download-artifact@v4
        with:
          name: smolfire-aarch64   # same-run artifact: retention-proof

      - name: Boot gate (TCG, SOFTGATE_BUDGET s, SOFTGATE_MODE soft|hard, retry-once on inconclusive)
        run: |
          set -e
          case "$SOFTGATE_MODE" in soft|hard) ;; *) echo "::error::SOFTGATE_MODE must be soft|hard, got '$SOFTGATE_MODE'"; exit 64 ;; esac
          case "$SOFTGATE_BUDGET" in ''|*[!0-9]*) echo "::error::SOFTGATE_BUDGET must be integer seconds, got '$SOFTGATE_BUDGET'"; exit 64 ;; esac
          echo "gate config: mode=$SOFTGATE_MODE budget=${SOFTGATE_BUDGET}s"
          run_gate() {
            SERIAL_LOG="$PWD/gate-serial-$1.log" \
              sh bin/ci/aarch64-boot-probe.sh smolfire-aarch64.qcow2 "$SOFTGATE_BUDGET" "max,pauth-impdef=on" \
              | tee "gate-$1.out"
            return "${PIPESTATUS[0]}"
          }
          rc=0; run_gate attempt1 || rc=$?
          attempts=1
          if [ "$rc" -eq 3 ] || [ "$rc" -eq 4 ]; then
            echo "::notice::attempt 1 inconclusive (rc=$rc) — retrying once (host-flake policy)"
            attempts=2
            rc=0; run_gate attempt2 || rc=$?
          fi
          VERDICT=$(grep -h -o 'VERDICT=[a-z-]*' gate-attempt${attempts}.out | tail -1)
          {
            echo "verdict=${VERDICT#VERDICT=}"
            echo "attempts=$attempts"
            echo "exit_code=$rc"
            echo "mode=$SOFTGATE_MODE"
            echo "budget=$SOFTGATE_BUDGET"
            grep -h -E 'TIME_TO_LOGIN=|LAST_MARKER=|QEMU_EXIT' "gate-attempt${attempts}.out" || true
          } > gate-verdict.txt
          cat gate-verdict.txt
          {
            echo "### aarch64 boot soft-gate"
            sed 's/^/    /' gate-verdict.txt
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) exit 0 ;;
            2) echo "::error::aarch64 image failed definitively (guest terminal string) — triage serial per UR-BSD-VERIFY rollback criteria"; exit 2 ;;
            *) if [ "$SOFTGATE_MODE" = hard ]; then
                 echo "::error::aarch64 TCG boot inconclusive after $attempts attempt(s): $VERDICT — hard mode: not verified booting"; exit 1
               fi
               echo "::warning::aarch64 TCG boot inconclusive after $attempts attempt(s): $VERDICT — TCG slowness indistinguishable from hang; image NOT verified broken, NOT verified booting"; exit 0 ;;
          esac

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-softgate-evidence
          if-no-files-found: warn
          path: |
            gate-verdict.txt
            gate-attempt*.out
            gate-serial-*.log
