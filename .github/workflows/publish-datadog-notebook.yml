name: Publish Datadog lower-bound notebook

on:
  workflow_dispatch:
    inputs:
      notebook_id:
        description: Existing Datadog notebook ID to update; leave blank to create the notebook once.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - docs/LOWER-BOUND-RUNTIME-2026-09-23.md
      - docs/datadog/smolfire-lower-bound-runtime-notebook.json
      - bin/render-datadog-notebook.py
      - bin/publish-datadog-notebook.py

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.DATADOG_NOTEBOOK_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Verify checked-in notebook payload
        run: python3 bin/render-datadog-notebook.py --check

      - name: Publish Datadog notebook
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DATADOG_API_SITE: ${{ vars.DATADOG_API_SITE }}
          DATADOG_APP_SITE: ${{ vars.DATADOG_APP_SITE }}
          DATADOG_NOTEBOOK_ID: ${{ inputs.notebook_id || vars.DATADOG_NOTEBOOK_ID }}
        run: python3 bin/publish-datadog-notebook.py --no-record
