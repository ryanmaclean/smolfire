name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── Nushell unit + integration tests ────────────────────────────────────────
  nu-tests:
    name: Nu tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Nushell
        run: |
          # Single source of truth for the Nushell version used by every workflow
          # and expected locally: .github/nu-version (bump it there, nowhere else).
          NU_VERSION="$(tr -d '[:space:]' < .github/nu-version)"
          # uname -m returns "arm64" on Apple Silicon; Nushell releases use "aarch64"
          ARCH=$(uname -m | sed 's/arm64/aarch64/')
          case "$(uname -s)" in
            Linux)  TRIPLE="${ARCH}-unknown-linux-musl" ;;
            Darwin) TRIPLE="${ARCH}-apple-darwin" ;;
          esac
          ARCHIVE="nu-${NU_VERSION}-${TRIPLE}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${ARCHIVE}" \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 "nu-${NU_VERSION}-${TRIPLE}/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # openssl -timeout flag and nc -w are used by try-irc-dm in coord-tick.nu.
      # Both are pre-installed on macOS runners; Linux needs netcat-openbsd.
      - name: Install netcat-openbsd (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends netcat-openbsd

      - name: Show Nushell version
        run: nu --version

      # mbox-parse-test.nu uses `use ../bin/mbox-parse.nu`. Running from the
      # tests/ directory ensures CWD-relative and file-relative resolution
      # both resolve to bin/mbox-parse.nu regardless of Nushell version.
      - name: mbox-parse unit tests
        working-directory: tests
        run: nu mbox-parse-test.nu

      # coord-tick-test.nu: integration tests — spawns `nu bin/coord-tick.nu`
      - name: coord-tick integration tests
        run: nu tests/coord-tick-test.nu

      # coord-dispatch-test.nu: billed-subprocess guard coverage for
      # dispatch-claude / find-claude (no other test in this suite reaches
      # bin/coord-dispatch.nu's claude-CLI path — only dispatch-vm is
      # exercised, by coord-vm-e2e-tests.nu).
      - name: coord-dispatch billed-subprocess guard tests
        run: nu tests/coord-dispatch-test.nu

      - name: spawn-subagent integration tests
        working-directory: .
        run: nu tests/spawn-subagent-test.nu

      # jail-execute-test.nu: experimental jail executor + coord-tick executor
      # selection. FreeBSD tools are PATH stubs, so this runs on Linux too.
      - name: jail executor tests
        run: nu tests/jail-execute-test.nu

      # Execute the pre-push guard against fixtures so hook refactors have
      # real coverage (nothing else runs this script; a parse error here
      # would otherwise only surface at push time on a developer machine).
      - name: pre-push guard (absent / clean / dirty spool fixtures)
        run: |
          nu bin/pre-push-check.nu --spool /nonexistent-spool
          nu bin/pre-push-check.nu --spool tests/fixtures/spool-clean.mbox
          if nu bin/pre-push-check.nu --spool tests/fixtures/spool-dirty.mbox; then
            echo "ERROR: dirty fixture spool passed the guard"; exit 1
          fi
          echo "dirty fixture correctly rejected"

      - name: sizereport parser tests
        run: nu tests/sizereport-test.nu

      - name: SMOLFIRE microVM metrics parser tests
        run: nu tests/smolfire-metrics-test.nu

      - name: pkgbase-watch parser tests (fixtures, offline)
        run: nu tests/pkgbase-watch-test.nu

      - name: smolfire rootfs assembly test
        run: nu tests/smolfire-rootfs-test.nu

      - name: tslog-phases aggregator test
        run: nu tests/tslog-phases-test.nu

      - name: spool-archive tests
        run: nu tests/spool-archive-test.nu

      - name: spool-tail tests
        run: nu tests/spool-tail-test.nu

      - name: spool-compact tests
        run: nu tests/spool-compact-test.nu

      - name: OpenLineage exporter tests
        run: nu tests/openlineage-export-test.nu

      # run-tests.nu --suite unit: runs mbox-parse unit tests + all FSM integration
      # tests (coord-fsm-tests.nu) without the VM e2e suite (no qcow2 in CI).
      - name: run-tests unit suite (mbox-parse + FSM)
        run: nu tests/run-tests.nu --suite unit

      # tpm-seal-test.nu has a built-in skip guard: exits 0 immediately when
      # tpm2-tools are not installed.  --dry-run also validates script syntax
      # on any host.
      - name: tpm-seal-test (dry-run / tpm2-tools absent skip)
        run: nu tests/tpm-seal-test.nu --dry-run

      # bhyve-tpm-pcr-verify.nu --dry-run skips all SSH + swtpm checks and
      # verifies the claims-reporting logic exits 0.
      - name: bhyve-tpm-pcr-verify (dry-run)
        working-directory: .
        run: nu tests/bhyve-tpm-pcr-verify.nu --dry-run

  # ── Shell script linting ─────────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Lint shell scripts
        run: |
          shellcheck bin/coord-run.sh tests/run-all.sh \
                     bin/analyze-image.sh bin/harvest.sh
          shellcheck --shell=sh \
                     release/tools/smolfire-qemu.conf \
                     release/tools/smolfire-qemu-aarch64.conf

  # ── Release config hook smoke-test ───────────────────────────────────────────
  conf-hook-test:
    name: Release conf hook test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test vm_extra_pre_umount trim logic
        shell: bash
        run: |
          set -eu
          DESTDIR=$(mktemp -d)
          # Create the directory tree that vm_extra_pre_umount strips
          mkdir -p \
            "$DESTDIR/usr/share/doc" \
            "$DESTDIR/usr/share/locale" \
            "$DESTDIR/usr/share/man" \
            "$DESTDIR/usr/share/examples" \
            "$DESTDIR/usr/share/nls" \
            "$DESTDIR/usr/share/openssl" \
            "$DESTDIR/usr/share/zoneinfo/America" \
            "$DESTDIR/usr/share/zoneinfo/Europe" \
            "$DESTDIR/usr/lib/debug" \
            "$DESTDIR/usr/tests" \
            "$DESTDIR/var/cache/pkg" \
            "$DESTDIR/usr/include" \
            "$DESTDIR/usr/lib" \
            "$DESTDIR/usr/bin" \
            "$DESTDIR/boot/kernel" \
            "$DESTDIR/etc/ssh" \
            "$DESTDIR/etc/pam.d" \
            "$DESTDIR/lib" \
            "$DESTDIR/usr/lib/compat" \
            "$DESTDIR/var/empty"
          touch "$DESTDIR/usr/lib/libfoo.a"
          touch "$DESTDIR/usr/share/zoneinfo/UTC"
          touch "$DESTDIR/usr/share/zoneinfo/America/New_York"
          # Stub out commands that require real system tools
          pw()        { :; }
          ssh-keygen(){
            local f=""
            while [ $# -gt 0 ]; do
              [ "$1" = "-f" ] && { f="$2"; shift 2; } || shift
            done
            [ -n "$f" ] && mkdir -p "$(dirname "$f")" && touch "$f" "$f.pub"
          }
          # shellcheck disable=SC2317
          chown()     { :; }
          # shellcheck disable=SC2317
          chmod()     { :; }
          export -f pw ssh-keygen chown chmod
          # Source and exercise the amd64 config
          # shellcheck source=release/tools/smolfire-qemu.conf
          . release/tools/smolfire-qemu.conf
          vm_extra_pre_umount
          # Assert expected dirs are gone
          fail=0
          for d in \
            "$DESTDIR/usr/share/doc" \
            "$DESTDIR/usr/share/locale" \
            "$DESTDIR/usr/share/man" \
            "$DESTDIR/usr/share/examples" \
            "$DESTDIR/usr/lib/debug" \
            "$DESTDIR/usr/tests" \
            "$DESTDIR/var/cache/pkg" \
            "$DESTDIR/usr/include"; do
            if [ -e "$d" ]; then
              echo "FAIL: expected $d to be removed" >&2; fail=1
            else
              echo "PASS: $d removed"
            fi
          done
          if [ -f "$DESTDIR/usr/lib/libfoo.a" ]; then
            echo "FAIL: static lib not removed" >&2; fail=1
          else
            echo "PASS: static lib removed"
          fi
          # UTC zoneinfo retained; America/ stripped
          if [ ! -f "$DESTDIR/usr/share/zoneinfo/UTC" ]; then
            echo "FAIL: UTC zoneinfo removed (should be kept)" >&2; fail=1
          else
            echo "PASS: UTC zoneinfo retained"
          fi
          if [ -d "$DESTDIR/usr/share/zoneinfo/America" ]; then
            echo "FAIL: America/ zoneinfo not removed" >&2; fail=1
          else
            echo "PASS: America/ zoneinfo removed"
          fi
          # Safety guard: empty DESTDIR must abort
          export DESTDIR=""
          # shellcheck source=release/tools/smolfire-qemu.conf
          . release/tools/smolfire-qemu.conf
          if vm_extra_pre_umount 2>/dev/null; then
            echo "FAIL: empty DESTDIR guard did not fire" >&2; fail=1
          else
            echo "PASS: empty DESTDIR guard fired correctly"
          fi
          exit "$fail"
