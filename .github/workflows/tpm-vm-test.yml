# SPDX-License-Identifier: Apache-2.0
# tpm-vm-test.yml — TPM 2.0 T1-T6 acceptance suite on <kvm-host> QEMU+swtpm.
# Runs against the smolfire amd64 image built with 'device tpm'. NOTE:
# post-eviction images (D-02 retired) no longer bake tpm2-tools — T3/T4/T6
# need the install-at-test-time step from tpm-hosted.yml ported here before
# this suite can pass against a current image.
# Image path: /home/studio/smolbsd-ci/smolbsd-amd64-tpm.qcow2
# Runner: <kvm-host>-amd64 (self-hosted, linux, amd64, kvm)
#
# Phase-3 acceptance gates:
#   T1: swtpm socket appears within 3s
#   T2: /dev/tpm0 present in guest
#   T3: tpmctl -G returns TPM 2.0 manufacturer info
#   T4: PCR 0 readable, non-zero
#   T5: seal/unseal round-trip with PCR 0+7 policy
#   T6: PCR changes after tpm2_pcrextend
#
# D-04 OVERRIDE: CONTEXT.md D-04 specified run-vm-tests.nu --tpm, but
# RESEARCH.md Pitfall 1 documents that step-tpm-device in run-vm-tests.nu
# uses nmdm console (FreeBSD-only, broken on Linux/QEMU). bhyve-tpm-pcr-verify.nu
# is used instead — covered by Claude's Discretion: "Whether to run bhyve
# or QEMU for the T2-T6 suite." smolfire image does not need any VM fixup script.

name: TPM VM Test

# Dispatch-only: this job needs the self-hosted KVM runner, which is
# currently offline. With `on: push` every push to any branch queued a run
# that could never start (60 lifetime runs; 8 zombies queued at the time of
# this change), leaving PR checks perpetually pending. Re-add a push trigger
# when the runner returns — or better, port T1-T6 to the hosted runner:
# ubuntu-latest now has working KVM (see build-image-hosted.yml preflight)
# and swtpm is an apt install away; the image can come from the hosted
# build's artifact instead of the runner-local path below —
# implemented in tpm-hosted.yml (auto-runs after each green hosted build).
on:
  workflow_dispatch:
  push:
    branches: [main]   # branch pushes must not queue runs on the (often offline) self-hosted runner
    paths:
      # Only run when something that could change TPM-suite outcomes moves.
      # Doc-only or coord-spool PRs skip the self-hosted TPM runner entirely.
      - sys/amd64/conf/SMOLFIRE-VM
      - release/tools/smolfire-qemu.conf
      - bin/bhyve-tpm-pcr-verify.nu
      - bin/run-vm-tests.nu
      - bin/guest-attest.nu
      - bin/attest-verify.nu
      - tests/tpm-seal-test.nu
      - tests/tpm-attest-verify-test.nu
      - .github/workflows/tpm-vm-test.yml

env:
  SMOLFIRE_IMAGE: /home/studio/smolbsd-ci/smolbsd-amd64-tpm.qcow2
  SWTPM_STATE:   /tmp/smolfire-tpm-ci
  SSH_PORT:      2241
  SSH_PASS:      smolfire

jobs:
  tpm-t1-t6:
    name: TPM T1-T6 acceptance suite
    runs-on: [self-hosted, linux, amd64, kvm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell
        run: |
          # Single source of truth for the Nushell version used by every workflow
          # and expected locally: .github/nu-version (bump it there, nowhere else).
          NU_VERSION="$(tr -d '[:space:]' < .github/nu-version)"
          ARCH=$(uname -m | sed 's/arm64/aarch64/')
          case "$(uname -s)" in
            Linux)  TRIPLE="${ARCH}-unknown-linux-musl" ;;
            Darwin) TRIPLE="${ARCH}-apple-darwin" ;;
          esac
          ARCHIVE="nu-${NU_VERSION}-${TRIPLE}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${ARCHIVE}" \
            | tar -xz -C "$HOME/.local/bin" --strip-components=1 "nu-${NU_VERSION}-${TRIPLE}/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Nushell version
        run: nu --version

      - name: Verify smolfire image exists
        run: |
          test -f "$SMOLFIRE_IMAGE" || {
            echo "ERROR: smolfire image not found at $SMOLFIRE_IMAGE"
            echo "Run build-image.yml workflow first to build the image."
            exit 1
          }
          echo "Image found: $(ls -lh $SMOLFIRE_IMAGE)"

      # The cloudware-release build installs the loader to /EFI/freebsd/loader.efi
      # but NOT to the UEFI removable-media fallback path /EFI/BOOT/BOOTX64.EFI.
      # A fresh OVMF VARS file has no NVRAM boot entry, so without the fallback
      # OVMF drops to the UEFI Shell instead of booting FreeBSD. Ensure the
      # fallback exists (idempotent — skips if already present).
      - name: Ensure UEFI fallback bootloader in ESP
        run: |
          set -e
          # The ESP is partition 1 (efi) on the GPT image. Use guestfish to copy
          # loader.efi to the fallback path without needing root/nbd.
          if ! command -v guestfish >/dev/null 2>&1; then
            sudo apt-get install -y libguestfs-tools
          fi
          # Check whether the fallback already exists
          HAS_FALLBACK=$(sudo LIBGUESTFS_BACKEND=direct guestfish --ro -a "$SMOLFIRE_IMAGE" -i \
            exists /EFI/BOOT/BOOTX64.EFI 2>/dev/null || echo "false")
          if [ "$HAS_FALLBACK" = "true" ]; then
            echo "Fallback bootloader already present — no patch needed"
          else
            echo "Fallback bootloader missing — copying loader.efi to /EFI/BOOT/BOOTX64.EFI"
            # guestfish inline command form (colon-separated) — avoids heredoc
            # indentation issues inside the YAML run block.
            sudo LIBGUESTFS_BACKEND=direct guestfish -a "$SMOLFIRE_IMAGE" \
              run : \
              mount /dev/sda1 / : \
              mkdir-p /EFI/BOOT : \
              cp /EFI/freebsd/loader.efi /EFI/BOOT/BOOTX64.EFI : \
              ls /EFI/BOOT/
            echo "Fallback bootloader installed"
          fi

      - name: Reset swtpm state (fresh PCR baseline)
        run: nu bin/swtpm-setup.nu --action reset --state-dir "$SWTPM_STATE"

      - name: Boot smolfire with QEMU+swtpm (background)
        run: |
          nohup nu bin/qemu-smolfire-vm.nu \
            --image "$SMOLFIRE_IMAGE" \
            --arch amd64 \
            --tpm \
            --tpm-state "$SWTPM_STATE" \
            --hostfwd-ssh "$SSH_PORT" \
            --mem 512M \
            --name smolfire-tpm-ci \
            > /tmp/smolfire-qemu-ci.log 2>&1 &
          echo "QEMU_PID=$!" >> "$GITHUB_ENV"
          echo "QEMU launched (PID $!)"

      - name: Wait for SSH boot-gate (120s timeout for KVM amd64)
        run: |
          for i in $(seq 1 120); do
            if ssh \
                 -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=3 \
                 -o BatchMode=yes \
                 -p "$SSH_PORT" root@127.0.0.1 "echo UP" 2>/dev/null; then
              echo "SSH_UP at ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: SSH did not respond within 120s"
          tail -30 /tmp/smolfire-qemu-ci.log || true
          exit 1

      - name: Run T1-T6 TPM acceptance suite
        run: |
          nu tests/bhyve-tpm-pcr-verify.nu \
            --host 127.0.0.1 \
            --port "$SSH_PORT" \
            --password "" \
            2>&1 | tee /tmp/smolfire-t1t6-ci.toml

      - name: Report T1-T6 results in job summary
        if: always()
        run: |
          echo "## TPM T1-T6 Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/smolfire-t1t6-ci.toml >> "$GITHUB_STEP_SUMMARY" || echo "(no results file)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── Phase 4: Remote Attestation (A5) ────────────────────────────────────
      # Generate TPM quote inside guest, verify on host. Reuses the running
      # QEMU+swtpm guest from T1-T6 — no reboot required.

      - name: A5 — Generate fresh nonce (anti-replay)
        run: |
          NONCE=$(openssl rand -hex 32)
          echo "nonce=$NONCE" >> "$GITHUB_ENV"
          echo "A5 nonce: $NONCE"

      - name: A5 — Install guest-attest.nu in guest
        run: |
          scp \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -P "$SSH_PORT" \
            bin/guest-attest.nu root@127.0.0.1:/tmp/guest-attest.nu

      - name: A5 — Run guest attestation (generate TPM quote)
        run: |
          ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p "$SSH_PORT" root@127.0.0.1 \
            "nu /tmp/guest-attest.nu --nonce $NONCE --task-id tpm-ci-$(date +%s) --output-dir /tmp" \
            > /tmp/guest-attest-output.txt 2>&1
          cat /tmp/guest-attest-output.txt

      - name: A5 — Copy quote artifacts from guest to host
        run: |
          scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1:/tmp/quote.msg /tmp/quote.msg
          scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1:/tmp/quote.sig /tmp/quote.sig
          scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1:/tmp/ak.pub /tmp/ak.pub
          echo "Artifacts copied to /tmp"

      - name: A5 — Build verifier input TOML (base64-encode artifacts)
        run: |
          QUOTE_B64=$(base64 -w0 /tmp/quote.msg)
          SIG_B64=$(base64 -w0 /tmp/quote.sig)
          AK_B64=$(base64 -w0 /tmp/ak.pub)
          # Extract PCR digest and nonce from guest output
          NONCE=$(grep 'nonce = ' /tmp/guest-attest-output.txt | tail -1 | sed 's/.*= "\(.*\)".*/\1/')
          PCR_DIGEST=$(grep 'pcr_digest = ' /tmp/guest-attest-output.txt | tail -1 | sed 's/.*= "\(.*\)".*/\1/')
          TASK_ID=$(grep 'task_id = ' /tmp/guest-attest-output.txt | tail -1 | sed 's/.*= "\(.*\)".*/\1/')

          cat > /tmp/quote-verifier.toml << EOF
          task_id = "$TASK_ID"
          nonce = "$NONCE"
          pcr_digest = "$PCR_DIGEST"
          quote_data = "$QUOTE_B64"
          signature = "$SIG_B64"
          ak_public = "$AK_B64"
          EOF
          echo "Verifier input ready at /tmp/quote-verifier.toml"

      - name: A5 — Run host-side verifier
        run: |
          nu bin/attest-verify.nu \
            --quote /tmp/quote-verifier.toml \
            --expected-pcr-digest "$PCR_DIGEST" \
            --nonce "$NONCE" \
            > /tmp/attestation-verdict.toml 2>&1
          echo "Verifier exit code: $?"
          cat /tmp/attestation-verdict.toml

      - name: A5 — Report attestation result in job summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Phase 4: Remote Attestation (A5)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/attestation-verdict.toml ]; then
            echo '```toml' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/attestation-verdict.toml >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Attestation verdict file not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup — shutdown guest and stop swtpm
        if: always()
        run: |
          ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -p "$SSH_PORT" root@127.0.0.1 "shutdown -p now" 2>/dev/null || true
          sleep 5
          nu bin/swtpm-setup.nu --action stop --state-dir "$SWTPM_STATE" || true
          kill "$QEMU_PID" 2>/dev/null || true
